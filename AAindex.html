<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>طلباتك - النظام المتقدم</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="https://i.postimg.cc/fTg000hC/13089187.png">
  <meta name="theme-color" content="#4f46e5">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');

    :root {
      /* Premium Colors */
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #e0e7ff;
      --secondary: #f8fafc;
      --secondary-text: #475569;
      --bg-body: #f1f5f9;
      --bg-card: rgba(255, 255, 255, 0.95);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      
      /* Status */
      --success: #10b981; --success-bg: #d1fae5;
      --danger: #ef4444; --danger-bg: #fee2e2;
      --warning: #f59e0b; --warning-bg: #fef3c7;
      --info: #3b82f6; --info-bg: #dbeafe;
      --wa: #25D366; /* WhatsApp Color */
      
      --radius-lg: 20px; --radius-md: 12px; --radius-sm: 8px;
      --shadow-soft: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      --shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --primary: #6366f1;
      --primary-hover: #818cf8;
      --primary-light: #3730a3;
      --secondary: #1e293b;
      --secondary-text: #cbd5e1;
      --bg-body: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.95);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    
    body { background: var(--bg-body); color: var(--text-main); transition: var(--transition); overflow-x: hidden; }

    /* Animations */
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse-soft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes slideInDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slideInUpToast { from { transform: translate(-50%, 100px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }

    .view-animate { animation: fadeInUp 0.5s ease forwards; }
    .stagger-1 { animation-delay: 0.1s; } .stagger-2 { animation-delay: 0.2s; } .stagger-3 { animation-delay: 0.3s; }

    /* Global Typography */
    h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }
    h2 { font-size: 1.4rem; font-weight: 700; margin-bottom: 1.2rem; }
    .muted { color: var(--text-muted); font-size: 0.95rem; }

    /* Layout & Glassmorphism */
    .screen { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }
    .hidden { display: none !important; }
    
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.8rem;
      box-shadow: var(--shadow-soft);
      margin-bottom: 1.5rem;
      transition: var(--transition);
      opacity: 0;
      animation: fadeInUp 0.5s ease forwards;
    }
    .card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }

    /* Header & Nav */
    .topbar {
      display: flex; justify-content: space-between; align-items: center; 
      margin-bottom: 2rem; background: var(--bg-card); padding: 1rem 1.5rem;
      border-radius: var(--radius-lg); box-shadow: var(--shadow-soft);
      backdrop-filter: blur(16px); position: sticky; top: 1rem; z-index: 50;
      animation: slideInDown 0.5s ease;
    }
    .user-info { display: flex; align-items: center; gap: 1rem; }
    .user-avatar { 
      width: 50px; height: 50px; border-radius: var(--radius-md); 
      background: linear-gradient(135deg, var(--primary), var(--primary-hover)); 
      color: white; display: flex; align-items: center; justify-content: center; 
      font-weight: 800; font-size: 1.5rem; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
    }
    
    .tabs {
      display: flex; gap: 0.5rem; margin-bottom: 2rem; overflow-x: auto; padding: 0.2rem;
      scrollbar-width: none; background: var(--border); border-radius: var(--radius-lg); padding: 0.5rem;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button { 
      background: transparent; color: var(--text-muted); border: none; padding: 0.8rem 1.5rem; 
      border-radius: var(--radius-md); font-weight: 600; flex-shrink: 0; transition: var(--transition);
    }
    .tabs button:hover { color: var(--text-main); }
    .tabs button.active { background: var(--bg-card); color: var(--primary); box-shadow: var(--shadow-soft); }

    /* Buttons */
    button {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      cursor: pointer; border: none; border-radius: var(--radius-md); padding: 0.8rem 1.5rem;
      font-size: 1rem; font-weight: 700; transition: var(--transition);
      background: var(--primary); color: white; position: relative; overflow: hidden;
    }
    button::after {
      content: ''; position: absolute; top: 50%; left: 50%; width: 5px; height: 5px;
      background: rgba(255,255,255,0.5); opacity: 0; border-radius: 100%;
      transform: scale(1) translate(-50%, -50%); transform-origin: 50% 50%;
    }
    button:active::after { animation: ripple 0.6s ease-out; }
    @keyframes ripple { 0% { transform: scale(0) translate(-50%, -50%); opacity: 0.5; } 100% { transform: scale(20) translate(-50%, -50%); opacity: 0; } }
    
    button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
    button.secondary { background: var(--secondary); color: var(--text-main); border: 1px solid var(--border); box-shadow: none; }
    button.secondary:hover { background: var(--border); }
    button.danger { background: var(--danger-bg); color: var(--danger); box-shadow: none; }
    button.success { background: var(--success); color: white; }
    button.btn-icon { padding: 0.6rem; border-radius: var(--radius-sm); }
    button.wa { background: var(--wa); color: white; }
    button.wa:hover { box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3); }

    /* Forms */
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
    .field { display: flex; flex-direction: column; gap: 0.5rem; }
    .field label { font-weight: 700; color: var(--text-main); font-size: 0.95rem; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 0.9rem 1.2rem; border: 2px solid var(--border);
      border-radius: var(--radius-md); background: var(--secondary); color: var(--text-main);
      transition: var(--transition); font-size: 1rem; font-weight: 500;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none; border-color: var(--primary); background: var(--bg-card);
      box-shadow: 0 0 0 4px var(--primary-light);
    }
    .wide { grid-column: 1 / -1; }

    /* Stats Dashboard */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.2rem; margin-bottom: 2rem; }
    .stat-card {
      background: var(--bg-card); border-radius: var(--radius-lg); padding: 1.8rem;
      border: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.5rem;
      position: relative; overflow: hidden; animation: fadeInUp 0.5s ease forwards; opacity: 0;
    }
    .stat-card::before {
      content: ''; position: absolute; top: 0; right: 0; width: 5px; height: 100%;
      background: linear-gradient(to bottom, var(--primary), var(--primary-hover));
    }
    .stat-icon { position: absolute; left: 1rem; top: 1.5rem; color: var(--primary-light); opacity: 0.3; transform: scale(2); }
    .stat-title { color: var(--text-muted); font-weight: 700; font-size: 1rem; z-index: 1; }
    .stat-value { font-size: 2.2rem; font-weight: 800; color: var(--text-main); z-index: 1; letter-spacing: -1px; }

    /* Progress Bar */
    .progress-bar-bg { background: var(--secondary); border-radius: 99px; height: 8px; width: 100%; overflow: hidden; margin-top: 1rem; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--success), #34d399); transition: width 1s ease-out; }

    /* Tables */
    .table-container { overflow-x: auto; border-radius: var(--radius-md); border: 1px solid var(--border); }
    .table { width: 100%; border-collapse: collapse; min-width: 850px; background: var(--bg-card); }
    .table th { padding: 1.2rem 1rem; background: var(--secondary); color: var(--text-muted); font-weight: 700; text-align: right; border-bottom: 2px solid var(--border); }
    .table td { padding: 1.2rem 1rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .table tr { transition: var(--transition); }
    .table tr:hover td { background: var(--secondary); }
    
    /* Badges */
    .badge { padding: 0.4rem 0.8rem; border-radius: 99px; font-size: 0.85rem; font-weight: 700; display: inline-flex; align-items: center; gap: 0.4rem; }
    .badge.new { background: var(--border); color: var(--text-main); }
    .badge.assigned { background: var(--warning-bg); color: var(--warning); }
    .badge.confirmed { background: var(--info-bg); color: var(--info); }
    .badge.rejected { background: var(--danger-bg); color: var(--danger); }
    .badge.shipping { background: var(--primary-light); color: var(--primary); }
    .badge.delivered { background: var(--success-bg); color: var(--success); }

    /* Chat/Team Board */
    .chat-container { display: flex; flex-direction: column; gap: 1rem; max-height: 500px; overflow-y: auto; padding-right: 0.5rem; margin-bottom: 1rem; }
    .chat-msg { background: var(--secondary); padding: 1rem; border-radius: var(--radius-md); border-top-right-radius: 0; width: fit-content; max-width: 80%; animation: fadeInUp 0.3s ease; }
    .chat-msg.me { background: var(--primary-light); color: var(--text-main); align-self: flex-end; border-radius: var(--radius-md); border-top-left-radius: 0; }
    .chat-header { font-size: 0.8rem; font-weight: 700; color: var(--primary); margin-bottom: 0.3rem; display: flex; justify-content: space-between; gap: 1rem;}
    .chat-time { color: var(--text-muted); font-weight: normal; font-size: 0.75rem; }

    /* Toast Notifications */
    #toast-container { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem; }
    .toast { background: var(--bg-card); border-left: 4px solid var(--primary); padding: 1rem 1.5rem; border-radius: var(--radius-sm); box-shadow: var(--shadow-hover); display: flex; align-items: center; gap: 1rem; font-weight: 700; animation: slideInUpToast 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--danger); }
    .toast-closing { opacity: 0; transform: translate(-50%, 50px); transition: all 0.3s ease; }

    /* Fullscreen Loader */
    #app-loader { position: fixed; inset: 0; background: var(--bg-body); z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 1.5rem; transition: opacity 0.5s ease; }
    .loader-ring { width: 60px; height: 60px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite; }

    /* Login Screen */
    .login-wrapper { display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 1rem; background: radial-gradient(circle at top right, var(--primary-light), var(--bg-body)); }
    .login-card { background: var(--bg-card); padding: 3rem 2rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-hover); width: 100%; max-width: 450px; text-align: center; border: 1px solid rgba(255,255,255,0.5); backdrop-filter: blur(20px); }
    
    @media (max-width: 768px) {
      .topbar { flex-direction: column; align-items: flex-start; gap: 1rem; position: relative; }
      .table th, .table td { white-space: nowrap; }
    }
  </style>
</head>
<body>

<!-- Startup Loader -->
<div id="app-loader">
  <div class="loader-ring"></div>
  <h2 style="color: var(--primary);">جاري تجهيز النظام...</h2>
</div>

<!-- Toast Container -->
<div id="toast-container"></div>

<!-- Login View -->
<main id="loginView" class="login-wrapper hidden">
  <div class="login-card view-animate">
    <div style="display: inline-flex; align-items: center; justify-content: center; width: 80px; height: 80px; background: var(--primary-light); border-radius: 25px; margin-bottom: 1.5rem; color: var(--primary); transform: rotate(-10deg);">
      <i data-lucide="zap" style="width: 40px; height: 40px;"></i>
    </div>
    <h1 style="color: var(--primary); font-size: 2.2rem; margin-bottom: 0.5rem;">طلباتك</h1>
    <p class="muted" style="margin-bottom: 2.5rem; font-size: 1.1rem;">إدارة ذكية وسريعة لفريقك</p>
    
    <div id="roleChoice" style="display: flex; flex-direction: column; gap: 1rem;">
      <button onclick="chooseRole('manager')" style="padding: 1.2rem; font-size: 1.1rem;"><i data-lucide="shield-check"></i> دخول الإدارة</button>
      <button class="secondary" onclick="chooseRole('confirmer')" style="padding: 1.2rem; font-size: 1.1rem; color: var(--success); border-color: var(--success-bg);"><i data-lucide="headset"></i> فريق التأكيد</button>
    </div>

    <div id="managerLogin" class="hidden view-animate">
      <div class="field" style="text-align: right; margin-bottom: 1.5rem;">
        <label>كود المدير السري</label>
        <input id="managerCode" type="password" inputmode="numeric" placeholder="••••••••" style="text-align: center; font-size: 1.5rem; letter-spacing: 5px;">
      </div>
      <div style="display: flex; gap: 1rem;">
        <button onclick="loginManager()" style="flex: 2;"><i data-lucide="log-in"></i> دخول</button>
        <button class="secondary" onclick="backRole()" style="flex: 1;"><i data-lucide="arrow-right"></i></button>
      </div>
    </div>

    <div id="confirmerLogin" class="hidden view-animate">
      <div class="field" style="text-align: right; margin-bottom: 1rem;">
        <label>اختر حسابك</label>
        <select id="profileSelect"></select>
      </div>
      <div class="field" style="text-align: right; margin-bottom: 1.5rem;">
        <label>كود الدخول</label>
        <input id="profileCode" type="password" placeholder="••••" style="text-align: center; font-size: 1.5rem; letter-spacing: 5px;">
      </div>
      <div style="display: flex; gap: 1rem;">
        <button class="success" onclick="loginConfirmer()" style="flex: 2;"><i data-lucide="log-in"></i> دخول للحساب</button>
        <button class="secondary" onclick="backRole()" style="flex: 1;"><i data-lucide="arrow-right"></i></button>
      </div>
    </div>
  </div>
</main>

<!-- Main App View -->
<main id="appView" class="screen hidden">
  <header class="topbar">
    <div class="user-info">
      <div class="user-avatar" id="userAvatar"></div>
      <div>
        <h1 style="margin: 0; font-size: 1.4rem;" id="userNameTitle"></h1>
        <p class="muted" id="whoRole" style="font-weight: 600; display: flex; align-items: center; gap: 0.3rem;"></p>
      </div>
    </div>
    <div style="display: flex; gap: 0.8rem; align-items: center;">
      <button class="btn-icon secondary" onclick="toggleTheme()" title="تغيير المظهر"><i data-lucide="moon" id="themeIcon"></i></button>
      <button class="secondary" onclick="logout()" style="color: var(--danger);"><i data-lucide="log-out"></i> خروج</button>
    </div>
  </header>

  <nav id="tabs" class="tabs"></nav>
  <section id="content"></section>
</main>

<script type="module">
// --- Firebase Config (لا تقم بتغييره أبدًا) ---
const firebaseConfig = {
  apiKey: "AIzaSyDNL9HKom4WCNK8zMC-tOBYzH5uM1L4kDU", 
  authDomain: "orders-team-25634.firebaseapp.com",
  projectId: "orders-team-25634", 
  storageBucket: "orders-team-25634.firebasestorage.app",
  messagingSenderId: "285601621203", 
  appId: "1:285601621203:web:c22025ca3569a1beaf2026"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, addDoc, updateDoc, onSnapshot, serverTimestamp, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const MANAGER_CODE = "7424623008", PAY_PER_DELIVERY = 10;
let db, data = { profiles: [], products: [], orders: [], messages: [] }, user = null, tab = "dashboard", unsub = [];
let initialLoadComplete = false;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => `${Number(n || 0).toFixed(2)} د.م`;
const fmt = t => t?.toDate ? t.toDate().toLocaleString('ar-MA', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : 'الآن';
const formatPhone = p => { let num = String(p).replace(/\D/g, ''); return num.startsWith('0') ? '212' + num.slice(1) : num; };

const stateName = { new: 'جديدة', assigned: 'بانتظار التأكيد', confirmed: 'تم التأكيد', rejected: 'مرفوضة', shipping: 'في الشحن', delivered: 'تم التوصيل' };
const stateIcon = { new: 'inbox', assigned: 'clock', confirmed: 'check-circle', rejected: 'x-circle', shipping: 'truck', delivered: 'package-check' };

// --- Toast System ---
function showToast(msg, type = 'success') {
  const container = $('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle-2' : 'alert-circle'}"></i> ${msg}`;
  container.appendChild(toast);
  lucide.createIcons({root: toast});
  setTimeout(() => { toast.classList.add('toast-closing'); setTimeout(() => toast.remove(), 300); }, 4000);
}

// --- Theme Management ---
function initTheme() {
  const saved = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  const icon = $('themeIcon'); if(icon) { icon.setAttribute('data-lucide', saved === 'dark' ? 'sun' : 'moon'); }
}
window.toggleTheme = () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  $('themeIcon').setAttribute('data-lucide', next === 'dark' ? 'sun' : 'moon');
  lucide.createIcons();
}

// --- Initialization ---
function start() {
  initTheme();
  db = getFirestore(initializeApp(firebaseConfig));
  let loaded = 0;
  
  const collections = ['profiles', 'products', 'orders', 'messages'];
  collections.forEach(name => {
    unsub.push(onSnapshot(query(collection(db, name), orderBy('createdAt', 'desc'), limit(name==='messages'?50:1000)), snap => {
      data[name] = name === 'messages' ? snap.docs.map(d => ({ id: d.id, ...d.data() })).reverse() : snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => !x.deleted && !x.archived);
      if (name === 'profiles') fillProfiles();
      if (!initialLoadComplete) {
        loaded++;
        if(loaded === collections.length) { initialLoadComplete = true; setTimeout(checkSession, 500); }
      } else if (user) { render(); }
    }));
  });
}

function fillProfiles() {
  const s = $('profileSelect'); if(!s) return;
  s.innerHTML = data.profiles.length ? '<option value="">— اختر حسابك —</option>' + data.profiles.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('') : '<option value="">لا يوجد حسابات</option>';
}

function checkSession() {
  $('app-loader').style.opacity = '0';
  setTimeout(() => $('app-loader').classList.add('hidden'), 500);
  
  const session = localStorage.getItem('orderSession');
  if (session) {
    try {
      const s = JSON.parse(session);
      if (s.role === 'manager') { user = s; return openApp(); }
      const p = data.profiles.find(x => x.id === s.id);
      if (p) { user = { role: 'confirmer', ...p }; return openApp(); }
    } catch(e) {}
    localStorage.removeItem('orderSession');
  }
  $('loginView').classList.remove('hidden');
  lucide.createIcons();
}

function saveSession() { if(user) localStorage.setItem('orderSession', JSON.stringify({ id: user.id || 'manager', role: user.role, name: user.name })); }

window.chooseRole = role => { $('roleChoice').classList.add('hidden'); $(role === 'manager' ? 'managerLogin' : 'confirmerLogin').classList.remove('hidden'); };
window.backRole = () => { $('managerLogin').classList.add('hidden'); $('confirmerLogin').classList.add('hidden'); $('roleChoice').classList.remove('hidden'); };

window.loginManager = () => {
  if ($('managerCode').value !== MANAGER_CODE) return showToast('الكود غير صحيح!', 'error');
  user = { role: 'manager', name: 'مدير النظام' }; saveSession(); openApp();
};

window.loginConfirmer = () => {
  let pid = $('profileSelect').value, p = data.profiles.find(x => x.id === pid);
  if (!p || $('profileCode').value !== p.code) return showToast('بيانات الدخول غير صحيحة!', 'error');
  user = { role: 'confirmer', ...p }; saveSession(); openApp();
};

function openApp() {
  $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden');
  $('userNameTitle').textContent = user.name;
  $('userAvatar').textContent = user.name.charAt(0);
  $('whoRole').innerHTML = `<i data-lucide="${user.role==='manager'?'shield':'headset'}" style="width:14px"></i> ${user.role === 'manager' ? 'الإدارة' : 'التأكيد'}`;
  render();
}

window.logout = () => { user = null; localStorage.removeItem('orderSession'); window.location.reload(); };

// --- Rendering Logic ---
function allowed(key) { return user.role === 'manager' || (user.permissions || []).includes(key); }
function myOrders() { return user.role === 'manager' ? data.orders : data.orders.filter(o => o.confirmerId === user.id); }

window.setTab = t => { tab = t; render(); };

function render() {
  if (!user) return;
  let tabsArr = [['dashboard', 'لوحة التحكم', 'layout-dashboard'], ['orders', 'الطلبيات', 'shopping-bag']];
  if (allowed('newOrder')) tabsArr.push(['neworder', 'إضافة طلبية', 'plus-circle']);
  if (allowed('products')) tabsArr.push(['products', 'المنتجات', 'package']);
  tabsArr.push(['chat', 'مجتمع الفريق', 'message-square']); // New Chat Tab
  if (user.role === 'manager') tabsArr.push(['team', 'إدارة الفريق', 'users']);

  $('tabs').innerHTML = tabsArr.map(([id, n, icon]) => 
    `<button class="${tab === id ? 'active' : ''}" onclick="setTab('${id}')"><i data-lucide="${icon}"></i> ${n}</button>`
  ).join('');

  const views = { dashboard: viewDashboard, orders: viewOrders, neworder: viewNewOrder, products: viewProducts, team: viewTeam, chat: viewChat };
  $('content').innerHTML = `<div class="view-animate">${(views[tab] || viewDashboard)()}</div>`;
  
  bindForms();
  lucide.createIcons();
  
  if(tab === 'chat') { const cc = $('chatScroll'); if(cc) cc.scrollTop = cc.scrollHeight; }
}

// --- Views ---
function viewDashboard() {
  let list = myOrders(), deliv = list.filter(o => o.status === 'delivered'), rev = deliv.reduce((s, o) => s + Number(o.total || 0), 0);
  let due = list.filter(o => o.status === 'assigned' && Date.now() - (o.assignedAt?.toDate?.() || new Date()) >= 900000);
  
  // Progress calc
  let target = 50; // monthly target example
  let progress = Math.min(100, (deliv.length / target) * 100);

  return `
    <div class="stats-grid">
      <div class="stat-card stagger-1">
        <i data-lucide="shopping-bag" class="stat-icon"></i>
        <span class="stat-title">إجمالي الطلبيات</span>
        <span class="stat-value">${list.length}</span>
      </div>
      <div class="stat-card stagger-2">
        <i data-lucide="check-circle" class="stat-icon"></i>
        <span class="stat-title">تم التوصيل بنجاح</span>
        <span class="stat-value" style="color: var(--success)">${deliv.length}</span>
      </div>
      ${user.role === 'manager' ? 
        `<div class="stat-card stagger-3"><i data-lucide="banknote" class="stat-icon"></i><span class="stat-title">المداخيل</span><span class="stat-value">${money(rev)}</span></div>` : 
        `<div class="stat-card stagger-3"><i data-lucide="wallet" class="stat-icon"></i><span class="stat-title">مستحقاتي</span><span class="stat-value">${money(Math.max(0, deliv.length * PAY_PER_DELIVERY - Number(user.paidTotal || 0)))}</span></div>`
      }
    </div>

    ${user.role === 'confirmer' ? `
    <div class="card stagger-1">
      <h3 style="margin-bottom: 0.5rem; display: flex; justify-content: space-between;"><span><i data-lucide="target"></i> هدف التوصيل</span> <span>${deliv.length} / ${target}</span></h3>
      <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${progress}%"></div></div>
      <p class="muted" style="margin-top: 0.5rem;">استمر يا بطل! كل طلبية موصلة تزيد أرباحك.</p>
    </div>` : ''}

    ${due.length ? `<div class="card" style="background: var(--warning-bg); border-color: var(--warning);"><h3 style="color: var(--warning); display:flex; align-items:center; gap:0.5rem;"><i data-lucide="alert-triangle"></i> لديك ${due.length} طلبيات بانتظارك!</h3><p>يرجى الدخول لقسم الطلبيات وتأكيدها فوراً.</p></div>` : ''}
    
    <div class="card stagger-2">
      <h2 style="display: flex; align-items: center; gap: 0.5rem;"><i data-lucide="clock"></i> أحدث الطلبيات</h2>
      ${smallOrderTable(list.slice(0, 5))}
    </div>
  `;
}

function smallOrderTable(list) {
  if(!list.length) return `<div style="text-align:center; padding: 2rem; color: var(--text-muted);"><i data-lucide="inbox" style="width:48px;height:48px;opacity:0.5;margin-bottom:1rem;"></i><p>لا توجد طلبيات بعد.</p></div>`;
  return `<div class="table-container"><table class="table"><thead><tr><th>العميل</th><th>المنتج</th><th>الحالة</th></tr></thead><tbody>${list.map(o => `<tr><td><strong>${esc(o.customerName)}</strong><br><span class="muted">${esc(o.city)}</span></td><td>${esc(o.productName)}</td><td><span class="badge ${o.status}"><i data-lucide="${stateIcon[o.status]}" style="width:12px"></i> ${stateName[o.status]}</span></td></tr>`).join('')}</tbody></table></div>`;
}

window.currentOrderFilter = { text: '', status: '' };
function viewOrders() {
  let list = myOrders();
  if(window.currentOrderFilter.status) list = list.filter(o => o.status === window.currentOrderFilter.status);
  if(window.currentOrderFilter.text) {
    const term = window.currentOrderFilter.text.toLowerCase();
    list = list.filter(o => (o.customerName||'').toLowerCase().includes(term) || (o.city||'').toLowerCase().includes(term) || (o.phone||'').includes(term));
  }

  return `
    <div class="card" style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; background: var(--bg-body);">
      <div class="field" style="flex: 2; min-width: 200px;"><input type="text" id="searchOrders" placeholder="بحث بالاسم، المدينة، الهاتف..." value="${esc(window.currentOrderFilter.text)}" oninput="updateFilters()"></div>
      <div class="field" style="flex: 1; min-width: 150px;"><select id="filterStatus" onchange="updateFilters()"><option value="">جميع الحالات</option>${Object.entries(stateName).map(([k,v]) => `<option value="${k}" ${window.currentOrderFilter.status===k?'selected':''}>${v}</option>`).join('')}</select></div>
    </div>
    <div class="card view-animate">
      ${list.length ? `<div class="table-container"><table class="table"><thead><tr><th>العميل</th><th>المنتج</th><th>التأكيد</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>${list.map(orderRow).join('')}</tbody></table></div>` : `<div style="text-align:center; padding: 3rem;"><p class="muted">لا توجد طلبيات مطابقة.</p></div>`}
    </div>`;
}

window.updateFilters = () => { window.currentOrderFilter = { text: $('searchOrders').value, status: $('filterStatus').value }; render(); };

function orderRow(o) {
  let p = data.profiles.find(x => x.id === o.confirmerId);
  let canConfirm = user.role === 'confirmer' && o.status === 'assigned';
  let elapsed = Date.now() - (o.assignedAt?.toDate?.() || new Date());
  let wait = canConfirm && elapsed < 900000;
  
  // WhatsApp Action Link
  let waLink = `<a href="https://wa.me/${formatPhone(o.phone)}" target="_blank" class="btn-icon wa" title="تواصل عبر واتساب"><i data-lucide="message-circle"></i></a>`;

  let managerSelect = user.role === 'manager' ? `
    <select onchange="assignOrder('${o.id}',this.value)" style="padding:0.4rem; border-radius:var(--radius-sm); margin-bottom:0.5rem; width:100%;">
      <option value="">${o.status === 'new' ? 'إسناد لمؤكد' : esc(p?.name || 'غير مسندة')}</option>
      ${data.profiles.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}
    </select>
    <select onchange="changeStatus('${o.id}',this.value)" style="padding:0.4rem; border-radius:var(--radius-sm); width:100%;">
      <option value="">حالة الشحن</option>
      ${o.status === 'confirmed' ? '<option value="shipping">تم وضعها للشحن</option>' : ''}
      ${o.status === 'shipping' ? '<option value="delivered">وصلت للعميل</option>' : ''}
    </select>` : '';

  let confControls = canConfirm ? (wait ? `<div class="badge new">متاح بعد ${Math.ceil((900000 - elapsed)/60000)} د</div>` : 
    `<textarea id="n-${o.id}" placeholder="ملاحظة..." style="width:100%; padding:0.5rem; margin-bottom:0.5rem; border-radius:var(--radius-sm); border:1px solid var(--border);"></textarea>
     <div style="display:flex; gap:0.5rem;"><button class="success" style="flex:1; padding:0.4rem;" onclick="confirmOrder('${o.id}','confirmed')">تأكيد</button><button class="danger" style="flex:1; padding:0.4rem;" onclick="confirmOrder('${o.id}','rejected')">رفض</button></div>`) : '';

  return `
    <tr>
      <td><strong>${esc(o.customerName)}</strong><div style="display:flex;align-items:center;gap:0.5rem;margin:0.3rem 0;"><span dir="ltr" class="muted">${esc(o.phone)}</span> ${waLink}</div><span class="muted"><i data-lucide="map-pin" style="width:12px"></i> ${esc(o.city)}</span></td>
      <td><strong>${esc(o.productName)}</strong> <span class="muted">×${o.qty}</span><br><span style="color:var(--primary);font-weight:bold">${money(o.total)}</span></td>
      <td><div style="font-size:0.9rem"><i data-lucide="user" style="width:12px"></i> ${esc(p?.name||'غير مسندة')}</div>${o.confirmationNote?`<div style="font-size:0.8rem; background:var(--bg-body); padding:0.4rem; border-radius:4px; margin-top:0.3rem;">${esc(o.confirmationNote)}</div>`:''}</td>
      <td><span class="badge ${o.status}"><i data-lucide="${stateIcon[o.status]}" style="width:12px"></i> ${stateName[o.status]}</span><div class="muted" style="font-size:0.75rem; margin-top:0.3rem;">${fmt(o.createdAt)}</div></td>
      <td style="min-width:180px;">${managerSelect}${confControls}</td>
    </tr>`;
}

function viewNewOrder() {
  if (!data.products.length) return `<div class="card text-center"><i data-lucide="package-x" style="width:48px;height:48px;color:var(--danger)"></i><h2>أضف منتجاً أولاً</h2></div>`;
  return `
    <div class="card" style="max-width: 700px; margin: auto;">
      <h2><i data-lucide="plus-circle"></i> إضافة طلبية جديدة</h2>
      <form id="orderForm" class="form-grid">
        <div class="field"><label>العميل</label><input name="customerName" required></div>
        <div class="field"><label>الهاتف</label><input name="phone" required dir="ltr" style="text-align:right"></div>
        <div class="field"><label>المدينة</label><input name="city" required></div>
        <div class="field"><label>المنتج</label><select name="productId" required><option value="">— اختر المنتج —</option>${data.products.map(p => `<option value="${p.id}">${esc(p.name)} - ${money(p.price)}</option>`).join('')}</select></div>
        <div class="field"><label>الكمية</label><input name="qty" type="number" min="1" value="1" required></div>
        <div class="wide" style="display:flex; justify-content:end; margin-top:1rem;"><button type="submit" id="btnSaveOrder"><i data-lucide="save"></i> حفظ وإضافة</button></div>
      </form>
    </div>`;
}

function viewProducts() {
  return `
    ${allowed('products') ? `
    <div class="card" style="background: var(--primary-light); border:none;">
      <h2 style="color: var(--primary);"><i data-lucide="package-plus"></i> منتج جديد</h2>
      <form id="productForm" style="display:flex; gap:1rem; flex-wrap:wrap; align-items:end;">
        <div class="field" style="flex:2; min-width:200px"><label>الاسم</label><input name="name" required style="background:var(--bg-card)"></div>
        <div class="field" style="flex:1; min-width:120px"><label>السعر</label><input name="price" type="number" step="0.01" required style="background:var(--bg-card)"></div>
        <button type="submit" style="padding:0.9rem 2rem;"><i data-lucide="plus"></i> إضافة</button>
      </form>
    </div>` : ''}
    <div class="card">
      <h2>المنتجات المتوفرة</h2>
      ${data.products.length ? `<div class="table-container"><table class="table"><thead><tr><th>المنتج</th><th>السعر</th>${user.role==='manager'?'<th></th>':''}</tr></thead><tbody>${data.products.map(p => `<tr><td><strong>${esc(p.name)}</strong></td><td>${money(p.price)}</td>${user.role==='manager'?`<td style="text-align:left"><button class="btn-icon danger" onclick="deleteProduct('${p.id}')"><i data-lucide="trash-2"></i></button></td>`:''}</tr>`).join('')}</tbody></table></div>` : '<p class="muted">لا توجد منتجات.</p>'}
    </div>`;
}

function viewTeam() {
  return `
    <div class="card" style="border-top: 4px solid var(--primary);">
      <h2><i data-lucide="user-plus"></i> إنشاء حساب مؤكد</h2>
      <form id="profileForm" class="form-grid">
        <div class="field"><label>الاسم</label><input name="name" required></div>
        <div class="field"><label>كود الدخول</label><input name="code" required></div>
        <div class="wide field">
          <label>صلاحيات إضافية</label>
          <div style="display:flex; gap:1.5rem; margin-top:0.5rem;">
            <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;"><input type="checkbox" name="permissions" value="newOrder"> إضافة طلبية</label>
            <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;"><input type="checkbox" name="permissions" value="products"> المنتجات</label>
          </div>
        </div>
        <div class="wide" style="text-align:left;"><button type="submit"><i data-lucide="check"></i> إنشاء الحساب</button></div>
      </form>
    </div>
    <div class="card">
      <h2>فريق التأكيد والمستحقات</h2>
      <div style="display:flex; flex-direction:column; gap:1rem;">
      ${data.profiles.map(p => {
        let d = data.orders.filter(o => o.confirmerId === p.id && o.status === 'delivered');
        let due = Math.max(0, (d.length * PAY_PER_DELIVERY) - Number(p.paidTotal || 0));
        return `<div style="background:var(--secondary); padding:1.2rem; border-radius:var(--radius-md); display:flex; justify-content:space-between; flex-wrap:wrap; gap:1rem; align-items:center;">
          <div><h3 style="margin-bottom:0.3rem">${esc(p.name)}</h3><span class="muted" style="font-size:0.85rem">الصلاحيات: ${(p.permissions||[]).join(', ')||'أساسية'}</span></div>
          <div style="display:flex; gap:1.5rem; background:var(--bg-card); padding:0.8rem 1.5rem; border-radius:var(--radius-sm); font-weight:bold;">
            <div><span class="muted" style="font-size:0.8rem; display:block">منجز</span>${d.length}</div>
            <div><span class="muted" style="font-size:0.8rem; display:block">مدفوع</span>${money(p.paidTotal||0)}</div>
            <div style="color:var(--warning)"><span class="muted" style="font-size:0.8rem; display:block">مستحق</span>${money(due)}</div>
          </div>
          <div style="display:flex; gap:0.5rem;"><button class="secondary btn-icon" onclick="payProfile('${p.id}')" title="تسجيل دفعة"><i data-lucide="banknote"></i></button><button class="danger btn-icon" onclick="deleteProfile('${p.id}')"><i data-lucide="user-x"></i></button></div>
        </div>`;
      }).join('') || '<p class="muted">لا يوجد فريق.</p>'}
      </div>
    </div>`;
}

// --- Team Chat / Notice Board ---
function viewChat() {
  return `
    <div class="card" style="height: calc(100vh - 200px); display: flex; flex-direction: column; padding: 1rem;">
      <h2 style="padding-bottom: 1rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem;"><i data-lucide="messages-square"></i> مجتمع الفريق</h2>
      <div id="chatScroll" class="chat-container" style="flex: 1;">
        ${data.messages.length ? data.messages.map(m => `
          <div class="chat-msg ${m.senderId === user.id || (m.senderId === 'manager' && user.role === 'manager') ? 'me' : ''}">
            <div class="chat-header"><span>${esc(m.senderName)} ${m.senderRole === 'manager' ? '<i data-lucide="shield-check" style="width:12px;color:var(--primary)"></i>' : ''}</span> <span class="chat-time">${fmt(m.createdAt)}</span></div>
            <div style="line-height: 1.5;">${esc(m.text)}</div>
          </div>
        `).join('') : '<div style="text-align:center;color:var(--text-muted);margin-top:2rem">ابدأ المحادثة مع فريقك...</div>'}
      </div>
      <form id="chatForm" style="display: flex; gap: 0.5rem; margin-top: 1rem;">
        <input type="text" name="msgText" placeholder="اكتب رسالة..." required style="flex: 1; padding: 1rem; border: 2px solid var(--border); border-radius: var(--radius-md); background: var(--secondary); color: var(--text-main);">
        <button type="submit" style="border-radius: var(--radius-md); padding: 0 1.5rem;"><i data-lucide="send"></i></button>
      </form>
    </div>
  `;
}

// --- Actions ---
function bindForms() {
  let btnLoading = (btn, icon) => { btn.disabled = true; btn.innerHTML = `<i data-lucide="loader-2" class="loader-ring" style="width:18px;height:18px;border:none;animation:spin 1s linear infinite;"></i>`; };
  let btnReset = (btn, html) => { btn.disabled = false; btn.innerHTML = html; lucide.createIcons(); };

  let fOrder = $('orderForm');
  if (fOrder) fOrder.onsubmit = async e => {
    e.preventDefault(); let btn = $('btnSaveOrder'), html = btn.innerHTML; btnLoading(btn);
    try {
      let x = Object.fromEntries(new FormData(fOrder)), p = data.products.find(i => i.id === x.productId), q = Number(x.qty);
      await addDoc(collection(db, 'orders'), { customerName: x.customerName.trim(), phone: x.phone.trim(), city: x.city.trim(), productId: p.id, productName: p.name, unitPrice: Number(p.price), qty: q, total: Number(p.price) * q, status: 'new', createdAt: serverTimestamp() });
      fOrder.reset(); showToast('تمت الإضافة بنجاح!'); setTab('orders');
    } catch(err) { showToast('خطأ: ' + err.message, 'error'); btnReset(btn, html); }
  };

  let fProd = $('productForm');
  if (fProd) fProd.onsubmit = async e => {
    e.preventDefault(); let btn = e.submitter; btn.disabled=true;
    try {
      let x = Object.fromEntries(new FormData(fProd));
      await addDoc(collection(db, 'products'), { name: x.name.trim(), price: Number(x.price), createdAt: serverTimestamp() });
      fProd.reset(); showToast('تم إضافة المنتج');
    } catch(err) { showToast('خطأ', 'error'); btn.disabled=false; }
  };

  let fProf = $('profileForm');
  if (fProf) fProf.onsubmit = async e => {
    e.preventDefault(); let btn = e.submitter; btn.disabled=true;
    try {
      let fd = new FormData(fProf);
      await addDoc(collection(db, 'profiles'), { name: fd.get('name').trim(), code: fd.get('code'), permissions: fd.getAll('permissions'), paidTotal: 0, createdAt: serverTimestamp() });
      fProf.reset(); showToast('تم إنشاء الحساب');
    } catch(err) { showToast('خطأ', 'error'); btn.disabled=false; }
  };

  let fChat = $('chatForm');
  if (fChat) fChat.onsubmit = async e => {
    e.preventDefault(); let text = fChat.msgText.value.trim(); if(!text) return;
    fChat.msgText.value = '';
    try {
      await addDoc(collection(db, 'messages'), { text, senderId: user.role==='manager'?'manager':user.id, senderName: user.name, senderRole: user.role, createdAt: serverTimestamp() });
    } catch(err) { showToast('تعذر إرسال الرسالة', 'error'); }
  };
}

window.assignOrder = async (id, pid) => { if(pid){ await updateDoc(doc(db,'orders',id),{confirmerId:pid, confirmerName:data.profiles.find(x=>x.id===pid).name, status:'assigned', assignedAt:serverTimestamp()}); showToast('تم الإسناد'); }};
window.changeStatus = async (id, status) => { if(status){ await updateDoc(doc(db,'orders',id),{status}); showToast('تم التحديث'); }};
window.confirmOrder = async (id, status) => { await updateDoc(doc(db,'orders',id),{status, confirmationNote:$(`n-${id}`)?.value.trim()||'', confirmedAt:serverTimestamp()}); showToast('تم حفظ التأكيد'); };
window.deleteProduct = async id => { if(confirm('حذف؟')) await updateDoc(doc(db,'products',id),{deleted:true}); };
window.deleteProfile = async id => { if(confirm('حذف الحساب؟')) await updateDoc(doc(db,'profiles',id),{archived:true}); };
window.payProfile = async id => { 
  let p = data.profiles.find(x=>x.id===id), amount = prompt(`كم دفعت لـ ${p.name}؟\nالمدفوع سابقاً: ${money(p.paidTotal||0)}`); 
  if(amount && Number(amount)>0) { await updateDoc(doc(db,'profiles',id),{paidTotal: Number(p.paidTotal||0) + Number(amount)}); showToast('تم التسجيل'); }
};

start();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
