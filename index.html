<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>طلباتك - النظام الاحترافي المتقدم</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="https://i.postimg.cc/fTg000hC/13089187.png">
  <meta name="theme-color" content="#0f172a">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');

    :root {
      /* Premium Colors */
      --primary: #4338ca; --primary-hover: #3730a3; --primary-glow: rgba(67, 56, 202, 0.3);
      --accent: #8b5cf6; 
      --bg-base: #f8fafc; --bg-surface: #ffffff; --bg-glass: rgba(255, 255, 255, 0.7);
      --text-main: #0f172a; --text-muted: #64748b;
      --border: #e2e8f0; --border-glass: rgba(255, 255, 255, 0.5);
      
      /* Status Colors */
      --st-new: #64748b; --st-new-bg: #f1f5f9;
      --st-assign: #d97706; --st-assign-bg: #fef3c7;
      --st-conf: #059669; --st-conf-bg: #d1fae5;
      --st-postpone: #7c3aed; --st-postpone-bg: #ede9fe;
      --st-noans: #ea580c; --st-noans-bg: #ffedd5;
      --st-rej: #dc2626; --st-rej-bg: #fee2e2;
      --st-ship: #2563eb; --st-ship-bg: #dbeafe;
      --st-deliv: #16a34a; --st-deliv-bg: #dcfce7;
      --st-ret: #be123c; --st-ret-bg: #ffe4e6;
      
      --wa-color: #25D366; --call-color: #007AFF;
      
      --radius-xl: 24px; --radius-lg: 16px; --radius-md: 12px; --radius-sm: 8px;
      --shadow-float: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --primary: #6366f1; --primary-hover: #818cf8; --primary-glow: rgba(99, 102, 241, 0.3);
      --bg-base: #020617; --bg-surface: #0f172a; --bg-glass: rgba(15, 23, 42, 0.7);
      --text-main: #f8fafc; --text-muted: #94a3b8;
      --border: #1e293b; --border-glass: rgba(255, 255, 255, 0.1);
      
      --st-new-bg: rgba(100, 116, 139, 0.15); --st-assign-bg: rgba(217, 119, 6, 0.15);
      --st-conf-bg: rgba(5, 150, 105, 0.15); --st-postpone-bg: rgba(124, 58, 237, 0.15);
      --st-noans-bg: rgba(234, 88, 12, 0.15); --st-rej-bg: rgba(220, 38, 38, 0.15);
      --st-ship-bg: rgba(37, 99, 235, 0.15); --st-deliv-bg: rgba(22, 163, 74, 0.15);
      --st-ret-bg: rgba(190, 18, 60, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { background: var(--bg-base); color: var(--text-main); transition: background-color 0.3s; padding-bottom: 3rem; }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* Animations */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .animate-in { animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    h1 { font-size: 1.8rem; font-weight: 900; }
    h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 1.2rem; }
    .muted { color: var(--text-muted); font-size: 0.9rem; }
    .hidden { display: none !important; }

    /* Login Screen - Premium Split Layout */
    .login-wrap { min-height: 100vh; display: grid; grid-template-columns: 1fr; background: var(--bg-base); }
    .login-visual { display: none; background: linear-gradient(135deg, var(--primary), var(--accent)); position: relative; overflow: hidden; padding: 4rem; color: white; display: flex; flex-direction: column; justify-content: center; }
    .login-visual::after { content: ''; position: absolute; inset: 0; background: url('https://www.transparenttextures.com/patterns/cubes.png'); opacity: 0.1; }
    .login-visual-glass { background: rgba(255,255,255,0.1); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.2); padding: 3rem; border-radius: var(--radius-xl); z-index: 2; }
    
    .login-form-area { display: flex; align-items: center; justify-content: center; padding: 2rem; position: relative; }
    .login-box { width: 100%; max-width: 440px; background: var(--bg-surface); padding: 3rem 2.5rem; border-radius: var(--radius-xl); box-shadow: var(--shadow-float); border: 1px solid var(--border); }
    
    @media (min-width: 1024px) {
      .login-wrap { grid-template-columns: 1.2fr 1fr; }
      .login-visual { display: flex; }
      .login-form-area { background: var(--bg-surface); }
      .login-box { box-shadow: none; border: none; background: transparent; padding: 0; }
    }

    /* Core Layout */
    .container { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }
    
    .card { background: var(--bg-surface); border-radius: var(--radius-lg); padding: 1.5rem; box-shadow: var(--shadow-card); border: 1px solid var(--border); margin-bottom: 1.5rem; transition: var(--transition); }
    .card:hover { box-shadow: var(--shadow-float); }

    /* Forms */
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.2rem; }
    .input-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .input-group label { font-weight: 700; font-size: 0.95rem; color: var(--text-main); }
    input, select, textarea { width: 100%; padding: 0.9rem 1.2rem; border-radius: var(--radius-md); border: 1.5px solid var(--border); background: var(--bg-base); color: var(--text-main); font-size: 1rem; font-weight: 500; transition: var(--transition); appearance: none; }
    select { background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: left 1rem center; background-size: 1em; padding-left: 2.5rem; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); background: var(--bg-surface); }
    textarea { min-height: 100px; resize: vertical; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem; padding: 0.9rem 1.5rem; border-radius: var(--radius-md); font-weight: 800; border: none; cursor: pointer; transition: var(--transition); font-size: 1rem; }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 14px var(--primary-glow); }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }
    .btn-secondary { background: var(--bg-base); color: var(--text-main); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); }
    .btn-icon { padding: 0.6rem; border-radius: var(--radius-sm); }
    
    /* Topbar */
    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; background: var(--bg-glass); backdrop-filter: blur(12px); border-radius: var(--radius-lg); margin-bottom: 1.5rem; box-shadow: var(--shadow-card); border: 1px solid var(--border-glass); position: sticky; top: 1rem; z-index: 40; }
    .tabs { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem; scrollbar-width: none; }
    .tab-btn { padding: 0.8rem 1.2rem; border-radius: var(--radius-md); border: none; background: transparent; color: var(--text-muted); font-weight: 800; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 0.5rem; transition: var(--transition); }
    .tab-btn.active { background: var(--bg-surface); color: var(--primary); box-shadow: var(--shadow-card); }

    /* Order Cards (Mobile First, deeply responsive) */
    .order-grid { display: flex; flex-direction: column; gap: 1.2rem; }
    .order-card { background: var(--bg-surface); border-radius: var(--radius-lg); border: 1px solid var(--border); overflow: hidden; transition: var(--transition); box-shadow: var(--shadow-card); }
    .order-card:hover { border-color: var(--primary); box-shadow: var(--shadow-float); }
    
    .oc-head { padding: 1.2rem; display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border); background: var(--bg-base); }
    .oc-body { padding: 1.2rem; display: grid; grid-template-columns: 1fr; gap: 1rem; }
    .oc-foot { padding: 1.2rem; border-top: 1px dashed var(--border); display: flex; flex-direction: column; gap: 0.8rem; background: var(--bg-base); }
    
    .info-row { display: flex; align-items: flex-start; gap: 0.8rem; }
    .info-icon { color: var(--primary); background: var(--primary-glow); padding: 0.5rem; border-radius: var(--radius-sm); display: flex; }
    
    .actions-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.5rem; }
    .action-btn { padding: 0.7rem; font-size: 0.9rem; font-weight: 800; border-radius: var(--radius-sm); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.4rem; transition: var(--transition); }
    
    @media (min-width: 768px) {
      .oc-body { grid-template-columns: repeat(3, 1fr); }
    }

    /* Badges */
    .badge { padding: 0.4rem 0.8rem; border-radius: 99px; font-size: 0.85rem; font-weight: 800; display: inline-flex; align-items: center; gap: 0.4rem; white-space: nowrap; }
    .badge.new { color: var(--st-new); background: var(--st-new-bg); }
    .badge.assigned { color: var(--st-assign); background: var(--st-assign-bg); }
    .badge.confirmed { color: var(--st-conf); background: var(--st-conf-bg); }
    .badge.postponed { color: var(--st-postpone); background: var(--st-postpone-bg); }
    .badge.no_answer { color: var(--st-noans); background: var(--st-noans-bg); }
    .badge.rejected { color: var(--st-rej); background: var(--st-rej-bg); }
    .badge.shipping { color: var(--st-ship); background: var(--st-ship-bg); }
    .badge.delivered { color: var(--st-deliv); background: var(--st-deliv-bg); }
    .badge.returned { color: var(--st-ret); background: var(--st-ret-bg); }

    /* Custom Modals System */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 999; display: flex; justify-content: center; align-items: center; padding: 1rem; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content { background: var(--bg-surface); width: 100%; max-width: 500px; border-radius: var(--radius-xl); padding: 2rem; box-shadow: var(--shadow-float); transform: scale(0.95); transition: transform 0.3s; max-height: 90vh; overflow-y: auto; }
    .modal-overlay.active .modal-content { transform: scale(1); }
    
    /* Product Image Upload Area */
    .img-upload { border: 2px dashed var(--border); border-radius: var(--radius-md); padding: 2rem; text-align: center; cursor: pointer; transition: var(--transition); background: var(--bg-base); position: relative; overflow: hidden; }
    .img-upload:hover { border-color: var(--primary); background: var(--primary-glow); }
    .img-preview { width: 100%; height: 200px; object-fit: cover; border-radius: var(--radius-sm); display: none; }

    /* Toast System */
    #toast-box { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem; pointer-events: none; }
    .toast { background: var(--bg-surface); color: var(--text-main); padding: 1rem 1.5rem; border-radius: var(--radius-md); box-shadow: var(--shadow-float); font-weight: 800; display: flex; align-items: center; gap: 0.8rem; animation: fadeUp 0.3s ease; border: 1px solid var(--border); pointer-events: auto; }

    /* Loader */
    #global-loader { position: fixed; inset: 0; background: var(--bg-base); z-index: 99999; display: flex; justify-content: center; align-items: center; flex-direction: column; gap: 1.5rem; transition: opacity 0.4s; }
    .spinner { width: 50px; height: 50px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="global-loader">
  <div class="spinner"></div>
  <h2 style="color: var(--primary)">جاري تجهيز النظام...</h2>
</div>

<div id="toast-box"></div>

<!-- Custom Modal Structure -->
<div id="customModal" class="modal-overlay">
  <div class="modal-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
      <h2 id="modalTitle" style="margin:0;"></h2>
      <button class="btn-icon btn-secondary" onclick="closeModal()"><i data-lucide="x"></i></button>
    </div>
    <div id="modalBody" style="margin-bottom:2rem; line-height:1.6;"></div>
    <div id="modalActions" style="display:flex; gap:1rem; justify-content:flex-end;"></div>
  </div>
</div>

<!-- Login Screen -->
<main id="loginView" class="login-wrap hidden">
  <div class="login-visual">
    <div class="login-visual-glass animate-in">
      <h1 style="font-size: 3rem; margin-bottom: 1rem;">طلباتك<br>برو</h1>
      <p style="font-size: 1.2rem; opacity: 0.9; line-height: 1.6;">الجيل الجديد من أنظمة إدارة التجارة الإلكترونية وفريق التأكيد. تحكم كامل، سرعة فائقة، وتجربة مستخدم لا مثيل لها.</p>
    </div>
  </div>
  
  <div class="login-form-area">
    <div class="login-box animate-in">
      <div style="text-align:center; margin-bottom: 2.5rem;">
        <div style="background:var(--primary-glow); width:70px; height:70px; border-radius:20px; display:inline-flex; align-items:center; justify-content:center; margin-bottom:1rem; color:var(--primary); transform:rotate(-5deg);">
          <i data-lucide="rocket" style="width:36px; height:36px;"></i>
        </div>
        <h2>تسجيل الدخول</h2>
        <p class="muted">مرحباً بك مجدداً، يرجى اختيار صفتك للدخول.</p>
      </div>

      <div id="roleChoice" style="display:flex; flex-direction:column; gap:1rem;">
        <button class="btn btn-primary" onclick="chooseRole('manager')" style="padding: 1.2rem;"><i data-lucide="shield-check"></i> دخول الإدارة (المدير)</button>
        <button class="btn btn-secondary" onclick="chooseRole('confirmer')" style="padding: 1.2rem; border-color: var(--st-conf); color: var(--st-conf);"><i data-lucide="headset"></i> دخول فريق التأكيد</button>
      </div>

      <div id="managerLogin" class="hidden animate-in">
        <div class="input-group" style="text-align:right; margin-bottom:2rem;">
          <label>الكود السري للإدارة</label>
          <input id="managerCode" type="password" inputmode="numeric" placeholder="••••••••" style="text-align:center; font-size:1.5rem; letter-spacing:8px;">
        </div>
        <div style="display:flex; gap:0.5rem;">
          <button class="btn btn-primary" onclick="loginManager()" style="flex:1"><i data-lucide="log-in"></i> دخول</button>
          <button class="btn btn-secondary" onclick="backRole()"><i data-lucide="arrow-right"></i></button>
        </div>
      </div>

      <div id="confirmerLogin" class="hidden animate-in">
        <div class="input-group" style="text-align:right; margin-bottom:1rem;">
          <label>البروفايل الخاص بك</label>
          <select id="profileSelect"></select>
        </div>
        <div class="input-group" style="text-align:right; margin-bottom:2rem;">
          <label>كود الدخول</label>
          <input id="profileCode" type="password" placeholder="••••" style="text-align:center; font-size:1.5rem; letter-spacing:8px;">
        </div>
        <div style="display:flex; gap:0.5rem;">
          <button class="btn btn-primary" style="flex:1; background:var(--st-conf);" onclick="loginConfirmer()"><i data-lucide="log-in"></i> دخول</button>
          <button class="btn btn-secondary" onclick="backRole()"><i data-lucide="arrow-right"></i></button>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Main App -->
<main id="appView" class="container hidden">
  <header class="topbar animate-in">
    <div style="display:flex; align-items:center; gap:1rem;">
      <div id="userAvatar" style="width:48px; height:48px; background:linear-gradient(135deg, var(--primary), var(--accent)); color:white; border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:1.5rem; box-shadow:0 4px 10px var(--primary-glow);"></div>
      <div>
        <h1 id="userNameTitle" style="font-size:1.2rem; margin:0;"></h1>
        <p id="whoRole" class="muted" style="font-weight:700; display:flex; align-items:center; gap:0.3rem; margin:0;"></p>
      </div>
    </div>
    <div style="display:flex; gap:0.5rem;">
      <button class="btn btn-secondary btn-icon" onclick="toggleTheme()"><i data-lucide="moon" id="themeIcon"></i></button>
      <button class="btn btn-secondary btn-icon" style="color:var(--st-rej); border-color:var(--st-rej-bg);" onclick="logout()"><i data-lucide="log-out"></i></button>
    </div>
  </header>

  <nav id="tabs" class="tabs animate-in"></nav>
  <section id="content" class="animate-in"></section>
</main>

<script type="module">
/* --- Firebase Config (بدون تغيير) --- */
const firebaseConfig = {
  apiKey: "AIzaSyDNL9HKom4WCNK8zMC-tOBYzH5uM1L4kDU", 
  authDomain: "orders-team-25634.firebaseapp.com",
  projectId: "orders-team-25634", 
  storageBucket: "orders-team-25634.firebasestorage.app",
  messagingSenderId: "285601621203", 
  appId: "1:285601621203:web:c22025ca3569a1beaf2026"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, addDoc, updateDoc, onSnapshot, serverTimestamp, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const MANAGER_CODE = "7424623008", PAY_PER_DELIVERY = 10;
let db, data = { profiles: [], products: [], orders: [] }, user = null, tab = "dashboard", unsub = [];
let initialLoad = false;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => `${Number(n || 0).toFixed(2)} د.م`;
const fmt = t => t?.toDate ? t.toDate().toLocaleString('ar-MA', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : 'الآن';
const formatPhone = p => { let num = String(p).replace(/\D/g, ''); return num.startsWith('0') ? '212' + num.slice(1) : num; };

// حالات الطلبيات الشاملة
const stateMap = {
  new: { name: 'جديدة', icon: 'inbox', color: 'var(--st-new)' },
  assigned: { name: 'بانتظار التأكيد', icon: 'clock', color: 'var(--st-assign)' },
  confirmed: { name: 'مؤكدة', icon: 'check-circle', color: 'var(--st-conf)' },
  postponed: { name: 'مؤجلة', icon: 'calendar-clock', color: 'var(--st-postpone)' },
  no_answer: { name: 'لا يرد', icon: 'phone-off', color: 'var(--st-noans)' },
  rejected: { name: 'ملغاة', icon: 'x-circle', color: 'var(--st-rej)' },
  shipping: { name: 'قيد الشحن', icon: 'truck', color: 'var(--st-ship)' },
  delivered: { name: 'تم التوصيل', icon: 'package-check', color: 'var(--st-deliv)' },
  returned: { name: 'مرتجع', icon: 'rotate-ccw', color: 'var(--st-ret)' }
};

// UI Helpers (Toast & Modal)
function showToast(msg, isError = false) {
  const box = $('toast-box'), t = document.createElement('div');
  t.className = 'toast';
  let iconColor = isError ? 'var(--st-rej)' : 'var(--st-conf)';
  t.innerHTML = `<i data-lucide="${isError ? 'alert-circle' : 'check-circle-2'}" style="color:${iconColor}"></i> <span>${msg}</span>`;
  box.appendChild(t); lucide.createIcons({root:t});
  setTimeout(() => { t.style.opacity=0; t.style.transform='translateY(20px)'; setTimeout(()=>t.remove(),300); }, 4000);
}

window.showModal = (title, htmlBody, actionsHtml = '') => {
  $('modalTitle').innerHTML = title;
  $('modalBody').innerHTML = htmlBody;
  $('modalActions').innerHTML = actionsHtml || `<button class="btn btn-secondary" onclick="closeModal()">إغلاق</button>`;
  $('customModal').classList.add('active');
  lucide.createIcons({root:$('customModal')});
};
window.closeModal = () => $('customModal').classList.remove('active');
window.askConfirm = (title, msg, onConfirm) => {
  window.tempConfirm = () => { closeModal(); onConfirm(); };
  showModal(title, `<p>${msg}</p>`, `<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button><button class="btn btn-primary" style="background:var(--st-rej)" onclick="tempConfirm()">نعم، متأكد</button>`);
};

// Theme
function initTheme() {
  const t = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
  if($('themeIcon')) $('themeIcon').setAttribute('data-lucide', t==='dark'?'sun':'moon');
}
window.toggleTheme = () => {
  const n = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', n);
  localStorage.setItem('theme', n);
  $('themeIcon').setAttribute('data-lucide', n==='dark'?'sun':'moon');
  lucide.createIcons();
}

// Init & Data
function start() {
  initTheme(); db = getFirestore(initializeApp(firebaseConfig));
  let loaded = 0;
  ['profiles', 'products', 'orders'].forEach(name => {
    unsub.push(onSnapshot(query(collection(db, name), orderBy('createdAt', 'desc'), limit(1500)), snap => {
      let prevOrders = name === 'orders' ? data.orders.length : 0;
      data[name] = snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>!x.deleted&&!x.archived);
      
      if(name==='profiles') fillProfiles();
      
      if(!initialLoad) { loaded++; if(loaded===3) { initialLoad=true; setTimeout(checkSession, 500); } }
      else if(user) {
        render();
        // Notification logic for confirmer
        if(name === 'orders' && user.role === 'confirmer') notifyNewOrders();
      }
    }));
  });
}

function notifyNewOrders() {
  let newAssigned = data.orders.filter(o => o.confirmerId === user.id && o.status === 'assigned');
  if(newAssigned.length > 0) {
    if ('Notification' in window && Notification.permission === 'granted') {

  }
}

function fillProfiles() {
  const s = $('profileSelect'); if(!s) return;
  s.innerHTML = data.profiles.length ? '<option value="">— اختر حسابك —</option>' + data.profiles.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('') : '<option value="">لا يوجد حسابات</option>';
}

function checkSession() {
  $('global-loader').style.opacity = '0'; setTimeout(() => $('global-loader').classList.add('hidden'), 400);
  const s = localStorage.getItem('orderSessionV2');
  if(s) {
    try {
      const parsed = JSON.parse(s);
      if(parsed.role === 'manager') { user = parsed; return openApp(); }
      const p = data.profiles.find(x => x.id === parsed.id);
      if(p) { user = { role: 'confirmer', ...p }; return openApp(); }
    } catch(e) {}
    localStorage.removeItem('orderSessionV2');
  }
  $('loginView').classList.remove('hidden'); lucide.createIcons();
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
}

// Image compression logic for product upload
window.handleImageSelect = (input) => {
  if(input.files && input.files[0]) {
    const file = input.files[0];
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 600; // Resize to save DB space
        const scale = MAX_WIDTH / img.width;
        canvas.width = MAX_WIDTH; canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const base64 = canvas.toDataURL('image/jpeg', 0.6);
        $('prodImgBase64').value = base64;
        $('imgPreview').src = base64;
        $('imgPreview').style.display = 'block';
        $('uploadIcon').style.display = 'none';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
};

          ${p.image ? `<img src="${p.image}" style="width:100%; height:180px; object-fit:cover;">` : `<div style="height:120px; background:var(--bg-base); display:flex; align-items:center; justify-content:center;"><i data-lucide="package" style="width:48px;height:48px;opacity:0.2;"></i></div>`}
          <div style="padding:1.5rem; flex:1; display:flex; flex-direction:column;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1rem;">
              <div style="font-weight:900; font-size:1.2rem">${esc(p.name)}</div>
              <div style="color:var(--primary); font-weight:900; font-size:1.2rem;">${money(p.price)}</div>
            </div>
            <div style="display:flex; gap:0.5rem; margin-top:auto;">
              <button class="btn btn-secondary" style="flex:1; padding:0.6rem;" onclick="viewProductDetails('${p.id}')"><i data-lucide="eye"></i> التفاصيل</button>
              ${user.role==='manager' ? `<button class="btn btn-icon" style="background:var(--st-rej-bg); color:var(--st-rej);" onclick="askDelProd('${p.id}')"><i data-lucide="trash-2"></i></button>` : ''}
            </div>
          </div>
        </div>`).join('') : '<div class="muted" style="grid-column:1/-1;">لا توجد منتجات مسجلة.</div>'}
    </div>`;
}

function viewTeam() {
  return `
    <div class="card">
      <h2 style="display:flex;align-items:center;gap:0.5rem;"><i data-lucide="user-plus"></i> إنشاء حساب مؤكد جديد</h2>
      <form id="profileForm" class="form-grid" style="margin-top:1.5rem;">
        <div class="input-group"><label>الاسم الكامل</label><input name="name" required></div>
        <div class="input-group"><label>الكود السري للدخول</label><input name="code" required></div>
        <div class="input-group" style="grid-column:1/-1;">
          <label>الصلاحيات الإضافية</label>
          <div style="display:flex; gap:2rem; margin-top:0.5rem; background:var(--bg-base); padding:1.2rem; border-radius:var(--radius-md); border:1px solid var(--border);">
            <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer; font-weight:700;"><input type="checkbox" name="permissions" value="newOrder" style="width:20px;height:20px;"> إضافة الطلبيات</label>
            <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer; font-weight:700;"><input type="checkbox" name="permissions" value="products" style="width:20px;height:20px;"> إدارة المنتجات</label>
          </div>
        </div>
        <div style="grid-column:1/-1; margin-top:1rem;"><button type="submit" class="btn btn-primary"><i data-lucide="check-circle"></i> إنشاء الحساب وتفعيله</button></div>
      </form>
    </div>
    
    <h2 style="margin-top:2.5rem; margin-bottom:1.5rem;">أداء فريق التأكيد والمستحقات</h2>
    <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:1.2rem;">
      ${data.profiles.map(p => {
        let d = data.orders.filter(o => o.confirmerId === p.id && o.status === 'delivered');
        let due = Math.max(0, (d.length * PAY_PER_DELIVERY) - Number(p.paidTotal || 0));
        return `
          <div class="card" style="margin:0; display:flex; flex-direction:column; padding:1.5rem;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1.5rem;">
              <div style="display:flex; align-items:center; gap:1rem;">
                <div style="width:48px;height:48px;background:var(--primary-glow);color:var(--primary);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:900;">${p.name.charAt(0)}</div>
                <div>
                  <h3 style="margin:0;">${esc(p.name)}</h3>
                  <span class="muted" style="font-size:0.85rem"><i data-lucide="key" style="width:12px;"></i> ${(p.permissions||[]).join(', ')||'التأكيد فقط'}</span>
                </div>
              </div>
              <button class="btn btn-icon" style="background:var(--st-rej-bg); color:var(--st-rej);" onclick="askDelProf('${p.id}')"><i data-lucide="user-x"></i></button>
            </div>
            
            <div style="background:var(--bg-base); padding:1.2rem; border-radius:var(--radius-md); display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1.5rem; text-align:center; border:1px solid var(--border);">
              <div><span class="muted" style="display:block; font-size:0.85rem; margin-bottom:0.3rem;">توصيل ناجح</span><strong style="font-size:1.4rem; color:var(--st-conf);">${d.length}</strong></div>
              <div><span class="muted" style="display:block; font-size:0.85rem; margin-bottom:0.3rem;">تم دفعه</span><strong style="font-size:1.2rem">${money(p.paidTotal||0)}</strong></div>
              <div style="grid-column:1/-1; padding-top:1rem; border-top:1px dashed var(--border);"><span class="muted" style="display:block; font-size:0.9rem; margin-bottom:0.3rem;">مستحق الدفع الآن</span><strong style="font-size:1.8rem; color:var(--primary);">${money(due)}</strong></div>
            </div>
            <button class="btn btn-secondary" style="width:100%; border-color:var(--primary); color:var(--primary); padding:1rem;" onclick="askPayProf('${p.id}')"><i data-lucide="banknote"></i> تسجيل دفعة للمؤكد</button>
          </div>`;
      }).join('') || '<p class="muted">لا يوجد أعضاء في الفريق حالياً.</p>'}
    </div>`;
}

// --- العمليات والأحداث ---
function bindForms() {
  let fOrd = $('orderForm');
  if(fOrd) fOrd.onsubmit = async e => {
    e.preventDefault(); let btn = e.submitter; btn.disabled=true;
    try {
      let x = Object.fromEntries(new FormData(fOrd)), p = data.products.find(i=>i.id===x.productId), q = Number(x.qty);
      await addDoc(collection(db, 'orders'), { customerName: x.customerName.trim(), phone: x.phone.trim(), city: x.city.trim(), productId: p.id, productName: p.name, unitPrice: Number(p.price), qty: q, total: Number(p.price)*q, status: 'new', createdAt: serverTimestamp() });
      fOrd.reset(); showToast('تم إضافة الطلبية بنجاح'); setTab('orders');
    } catch(err) { showToast('حدث خطأ: ' + err.message, true); btn.disabled=false; }
  };

  let fPrd = $('productForm');
  if(fPrd) fPrd.onsubmit = async e => {
    e.preventDefault(); let btn = e.submitter; btn.disabled=true;
    try {
      let fd = new FormData(fPrd);
      await addDoc(collection(db, 'products'), { 
        name: fd.get('name').trim(), price: Number(fd.get('price')), 
        description: fd.get('description').trim(), strategy: fd.get('strategy').trim(),
        image: fd.get('imageBase64') || null,
        createdAt: serverTimestamp() 
      });
      fPrd.reset(); $('imgPreview').style.display='none'; $('uploadIcon').style.display='block'; $('prodImgBase64').value='';
      showToast('تم حفظ المنتج بنجاح'); btn.disabled=false;
    } catch(err) { showToast('خطأ في الحفظ', true); btn.disabled=false; }
  };

  let fPrf = $('profileForm');
  if(fPrf) fPrf.onsubmit = async e => {
    e.preventDefault(); let btn = e.submitter; btn.disabled=true;
    try {
      let fd = new FormData(fPrf);
      await addDoc(collection(db, 'profiles'), { name: fd.get('name').trim(), code: fd.get('code'), permissions: fd.getAll('permissions'), paidTotal: 0, createdAt: serverTimestamp() });
      fPrf.reset(); showToast('تم إنشاء الحساب بنجاح'); btn.disabled=false;
    } catch(err) { showToast('خطأ في الإنشاء', true); btn.disabled=false; }
  };
}

// Manager/Confirmer Actions
window.assignOrder = async (id, pid) => { if(pid) { await updateDoc(doc(db,'orders',id),{confirmerId:pid, status:'assigned', assignedAt:serverTimestamp()}); showToast('تم إسناد الطلبية'); }};
window.changeStatus = async (id, st) => { if(st) { await updateDoc(doc(db,'orders',id),{status:st}); showToast('تم تحديث حالة الطلبية'); }};
window.doConfirm = async (id, st) => { let note = $(`n-${id}`)?.value.trim()||''; await updateDoc(doc(db,'orders',id),{status:st, confirmationNote:note, confirmedAt:serverTimestamp()}); showToast('تم تسجيل ردك بنجاح'); };

// Deletion & Payment with Custom Modals
window.askDelProd = (id) => askConfirm('حذف المنتج', 'هل أنت متأكد من رغبتك في حذف هذا المنتج نهائياً من المستودع؟', async () => { await updateDoc(doc(db,'products',id),{deleted:true}); showToast('تم الحذف'); });
window.askDelProf = (id) => askConfirm('حذف الحساب', 'هل تريد فعلاً حذف حساب هذا المؤكد؟ لن يتم حذف تاريخ طلبياته.', async () => { await updateDoc(doc(db,'profiles',id),{archived:true}); showToast('تم الحذف'); });
window.askPayProf = (id) => {
  let p = data.profiles.find(x=>x.id===id);
  window.tempPay = async () => {
    let amt = Number($('payAmountInp').value);
    if(amt > 0) { await updateDoc(doc(db,'profiles',id),{paidTotal: Number(p.paidTotal||0) + amt}); showToast('تم تسجيل الدفعة'); closeModal(); }
  };
  showModal('تسجيل دفعة مالية', `<p>أدخل المبلغ الذي قمت بدفعه للمؤكد <strong>${esc(p.name)}</strong> الآن:</p><div class="input-group"><input type="number" id="payAmountInp" placeholder="المبلغ بـ د.م" min="1"></div>`, `<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button><button class="btn btn-primary" onclick="tempPay()">تسجيل وحفظ</button>`);
};

start();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
