<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>غرفة العمليات - إدارة الطلبيات</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="https://i.postimg.cc/fTg000hC/13089187.png">
  <meta name="theme-color" content="#080b12">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap');

    :root {
      /* ===== Day Ops (light) ===== */
      --bg: #eef1f6;
      --bg-grid: rgba(18, 20, 28, 0.045);
      --surface: #ffffff;
      --surface-alt: #f4f6f9;
      --ink: #12141c;
      --muted: #667085;
      --border: #e2e5eb;
      --border-strong: #cdd3dd;

      --primary: #b8710b;
      --primary-ink: #ffffff;
      --primary-soft: rgba(184, 113, 11, 0.12);
      --primary-glow: rgba(184, 113, 11, 0.22);
      --teal: #0c8f82;
      --teal-soft: rgba(12, 143, 130, 0.12);

      --st-new: #64748b;      --st-new-bg: #eef1f5;
      --st-assign: #b8710b;   --st-assign-bg: #faf0dd;
      --st-conf: #0c8f82;     --st-conf-bg: #dff3f0;
      --st-postpone: #7c5cbf; --st-postpone-bg: #efe9fb;
      --st-noans: #c2560f;    --st-noans-bg: #fbe7db;
      --st-rej: #c62b3d;      --st-rej-bg: #fbe3e6;
      --st-ship: #2563a8;     --st-ship-bg: #e1edfa;
      --st-deliv: #1d8a4c;    --st-deliv-bg: #e1f4e8;
      --st-ret: #a3134a;      --st-ret-bg: #fbe1eb;

      --wa-color: #1fa855; --call-color: #2563a8;

      --radius-xl: 22px; --radius-lg: 16px; --radius-md: 11px; --radius-sm: 8px;
      --shadow-float: 0 24px 48px -20px rgba(18, 20, 28, 0.22);
      --shadow-card: 0 1px 2px rgba(18,20,28,0.04), 0 1px 0 rgba(18,20,28,0.03);
      --transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      --font-num: 'IBM Plex Mono', ui-monospace, monospace;
    }

    [data-theme="dark"] {
      /* ===== Night Ops (dark) ===== */
      --bg: #080b12;
      --bg-grid: rgba(255,255,255,0.035);
      --surface: #111621;
      --surface-alt: #151b28;
      --ink: #edf0f5;
      --muted: #8b93a6;
      --border: #212736;
      --border-strong: #2c3345;

      --primary: #f0a93a;
      --primary-ink: #171106;
      --primary-soft: rgba(240, 169, 58, 0.14);
      --primary-glow: rgba(240, 169, 58, 0.28);
      --teal: #2fd4c0;
      --teal-soft: rgba(47, 212, 192, 0.14);

      --st-new: #94a1b8;      --st-new-bg: rgba(148,161,184,0.13);
      --st-assign: #f0a93a;   --st-assign-bg: rgba(240,169,58,0.14);
      --st-conf: #2fd4c0;     --st-conf-bg: rgba(47,212,192,0.13);
      --st-postpone: #a48af0; --st-postpone-bg: rgba(164,138,240,0.14);
      --st-noans: #f0824a;    --st-noans-bg: rgba(240,130,74,0.14);
      --st-rej: #f0596b;      --st-rej-bg: rgba(240,89,107,0.14);
      --st-ship: #5b9de8;     --st-ship-bg: rgba(91,157,232,0.14);
      --st-deliv: #57cf85;    --st-deliv-bg: rgba(87,207,133,0.14);
      --st-ret: #f0568f;      --st-ret-bg: rgba(240,86,143,0.14);

      --shadow-float: 0 24px 60px -18px rgba(0,0,0,0.55);
      --shadow-card: 0 1px 0 rgba(255,255,255,0.02), 0 6px 16px -10px rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background:
        radial-gradient(circle at 1px 1px, var(--bg-grid) 1px, transparent 1px) 0 0/22px 22px,
        var(--bg);
      color: var(--ink); transition: background-color 0.3s, color 0.3s; padding-bottom: 4rem; min-height:100vh;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes dashMove { to { stroke-dashoffset: -40; } }
    @keyframes pulseDot { 0%,100% { box-shadow: 0 0 0 0 var(--teal-soft); } 50% { box-shadow: 0 0 0 6px transparent; } }
    .animate-in { animation: fadeUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    h1 { font-size: 1.7rem; font-weight: 900; letter-spacing: -0.01em; }
    h2 { font-size: 1.25rem; font-weight: 800; margin-bottom: 1.1rem; letter-spacing: -0.01em; }
    h3 { font-weight: 800; }
    .muted { color: var(--muted); font-size: 0.88rem; }
    .hidden { display: none !important; }
    .mono { font-family: var(--font-num); }

    /* ===================== LOGIN ===================== */
    .login-wrap { min-height: 100vh; display: grid; grid-template-columns: 1fr; background: var(--bg); }
    .login-visual {
      display: none; position: relative; overflow: hidden; padding: 4rem;
      background: #0a0e17; color: #f4f6fb; flex-direction: column; justify-content: center;
    }
    .route-grid { position:absolute; inset:0; background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.08) 1px, transparent 1px); background-size: 26px 26px; }
    .login-visual-inner { position: relative; z-index: 2; max-width: 460px; }
    .route-badge { display:inline-flex; align-items:center; gap:0.5rem; background:rgba(240,169,58,0.15); border:1px solid rgba(240,169,58,0.35); color:#f0a93a; padding:0.4rem 0.9rem; border-radius:99px; font-weight:800; font-size:0.82rem; margin-bottom:1.6rem; }
    .route-badge .dot { width:7px;height:7px;border-radius:50%; background:#f0a93a; animation: pulseDot 2s infinite; }

    .login-form-area { display: flex; align-items: center; justify-content: center; padding: 2rem; position: relative; }
    .login-box { width: 100%; max-width: 430px; background: var(--surface); padding: 2.75rem 2.25rem; border-radius: var(--radius-xl); box-shadow: var(--shadow-float); border: 1px solid var(--border); }

    @media (min-width: 1024px) {
      .login-wrap { grid-template-columns: 1.15fr 1fr; }
      .login-visual { display: flex; }
      .login-form-area { background: var(--surface-alt); }
      .login-box { box-shadow: var(--shadow-card); }
    }

    .container { max-width: 1360px; margin: 0 auto; padding: 1.25rem 1.25rem 2rem; }

    .card { background: var(--surface); border-radius: var(--radius-lg); padding: 1.4rem; box-shadow: var(--shadow-card); border: 1px solid var(--border); margin-bottom: 1.25rem; }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.1rem; }
    .input-group { display: flex; flex-direction: column; gap: 0.45rem; }
    .input-group label { font-weight: 700; font-size: 0.9rem; color: var(--ink); }
    input, select, textarea {
      width: 100%; padding: 0.85rem 1.1rem; border-radius: var(--radius-md); border: 1.5px solid var(--border);
      background: var(--surface-alt); color: var(--ink); font-size: 0.98rem; font-weight: 500; transition: var(--transition); appearance: none;
    }
    select { background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23667085' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: left 1rem center; background-size: 1em; padding-left: 2.4rem; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); background: var(--surface); }
    input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
    textarea { min-height: 90px; resize: vertical; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.55rem; padding: 0.85rem 1.4rem; border-radius: var(--radius-md); font-weight: 800; border: none; cursor: pointer; transition: var(--transition); font-size: 0.96rem; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: var(--primary-ink); }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-secondary { background: var(--surface-alt); color: var(--ink); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--border-strong); }
    .btn-icon { padding: 0.6rem; border-radius: var(--radius-sm); }

    /* ===================== TOPBAR / TABS ===================== */
    .topbar { display: flex; justify-content: space-between; align-items: center; gap:1rem; padding: 0.9rem 1.3rem; background: var(--surface); border-radius: var(--radius-lg); margin-bottom: 1.1rem; box-shadow: var(--shadow-card); border: 1px solid var(--border); position: sticky; top: 0.9rem; z-index: 40; }
    .live-dot { display:inline-flex; align-items:center; gap:0.4rem; font-size:0.78rem; font-weight:700; color: var(--teal); }
    .live-dot span.p { width:7px; height:7px; border-radius:50%; background: var(--teal); animation: pulseDot 2s infinite; }

    .tabs { display: flex; gap: 0.35rem; overflow-x: auto; padding: 0.3rem; margin-bottom: 1.1rem; background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border); scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display:none; }
    .tab-btn { padding: 0.7rem 1.05rem; border-radius: var(--radius-sm); border: none; background: transparent; color: var(--muted); font-weight: 800; font-size:0.92rem; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 0.5rem; transition: var(--transition); }
    .tab-btn.active { background: var(--primary-soft); color: var(--primary); }
    .tab-btn:not(.active):hover { background: var(--surface-alt); color: var(--ink); }

    /* ===================== STAT / DASHBOARD ===================== */
    .stat-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:1rem; margin-bottom:1.25rem; }
    .stat-card { background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-lg); padding:1.3rem; box-shadow: var(--shadow-card); position:relative; overflow:hidden; }
    .stat-card .lbl { display:flex; align-items:center; gap:0.5rem; color:var(--muted); font-weight:700; font-size:0.85rem; margin-bottom:0.6rem; }
    .stat-card .val { font-size:2.1rem; font-weight:900; letter-spacing:-0.02em; }
    .stat-card .bar { position:absolute; inset-inline-start:0; top:0; bottom:0; width:4px; }

    .sparkline { display:flex; align-items:flex-end; gap:5px; height:64px; margin-top:0.9rem; }
    .sparkline .bar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:0.35rem; }
    .sparkline .bar-fill { width:100%; border-radius:5px 5px 2px 2px; background: var(--primary-soft); position:relative; min-height:4px; }
    .sparkline .bar-fill.today { background: var(--primary); }
    .sparkline .bar-lbl { font-size:0.68rem; color:var(--muted); font-weight:700; }

    .ring { width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;
      background: conic-gradient(var(--ring-c, var(--teal)) calc(var(--pct) * 3.6deg), var(--border) 0deg); }
    .ring-hole { width:44px; height:44px; border-radius:50%; background:var(--surface); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:0.78rem; }

    .priority-item { display:flex; align-items:center; gap:0.9rem; padding:0.85rem 1rem; border:1px solid var(--border); border-radius: var(--radius-md); background: var(--surface-alt); }
    .priority-item .age-pip { font-family:var(--font-num); font-weight:700; font-size:0.78rem; padding:0.25rem 0.55rem; border-radius:99px; white-space:nowrap; }

    .lb-row { display:flex; align-items:center; gap:0.8rem; padding:0.7rem 0; border-bottom:1px dashed var(--border); }
    .lb-row:last-child { border-bottom:none; }
    .lb-rank { width:26px; height:26px; border-radius:8px; background:var(--surface-alt); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:0.8rem; color:var(--muted); flex-shrink:0; }

    /* ===================== ORDER "WAYBILL" CARDS ===================== */
    .toolbar { display:flex; gap:0.8rem; flex-wrap:wrap; align-items:center; padding:1rem; margin-bottom:1.25rem; }
    .search-wrap { position:relative; flex:2; min-width:220px; }
    .search-wrap i { position:absolute; inset-inline-start:0.9rem; top:50%; transform:translateY(-50%); color:var(--muted); width:18px; height:18px; }
    .search-wrap input { padding-inline-start: 2.6rem; }

    .order-grid { display: flex; flex-direction: column; gap: 1.1rem; }
    .order-card { background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-card); overflow: visible; position:relative; }

    .oc-head { padding: 1.1rem 1.3rem; display: flex; justify-content: space-between; align-items: center; gap:1rem; }
    .oc-track { font-family: var(--font-num); font-weight:700; font-size:0.78rem; color:var(--muted); display:flex; align-items:center; gap:0.5rem; }
    .oc-cust { font-size: 1.12rem; font-weight: 900; margin-top:0.15rem; }

    .oc-body { padding: 0 1.3rem 1.1rem; display: grid; grid-template-columns: 1fr; gap: 0.9rem; }
    .info-row { display: flex; align-items: flex-start; gap: 0.75rem; }
    .info-icon { color: var(--primary); background: var(--primary-soft); padding: 0.5rem; border-radius: var(--radius-sm); display: flex; flex-shrink:0; }

    .oc-perforation { position:relative; border-top: 1.5px dashed var(--border-strong); margin: 0 -1px; }
    .oc-perforation::before, .oc-perforation::after { content:''; position:absolute; width:16px; height:16px; background:var(--bg); border-radius:50%; top:-8px; border:1px solid var(--border); }
    .oc-perforation::before { inset-inline-start:-9px; }
    .oc-perforation::after { inset-inline-end:-9px; }

    .oc-foot { padding: 1.1rem 1.3rem; display: flex; flex-direction: column; gap: 0.7rem; background: var(--surface-alt); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }

    .actions-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.5rem; }
    .action-btn { padding: 0.68rem; font-size: 0.87rem; font-weight: 800; border-radius: var(--radius-sm); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.4rem; transition: var(--transition); color:white; }
    .action-btn:active{ transform: scale(0.96); }
    .icon-link { display:flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:var(--radius-sm); background:var(--surface); border:1px solid var(--border); color:var(--muted); flex-shrink:0; transition:var(--transition); }
    .icon-link:hover { color: var(--ink); border-color:var(--border-strong); }

    @media (min-width: 780px) { .oc-body { grid-template-columns: repeat(3, 1fr); } }

    .badge { padding: 0.38rem 0.75rem; border-radius: 99px; font-size: 0.8rem; font-weight: 800; display: inline-flex; align-items: center; gap: 0.35rem; white-space: nowrap; }
    .badge.new { color: var(--st-new); background: var(--st-new-bg); }
    .badge.assigned { color: var(--st-assign); background: var(--st-assign-bg); }
    .badge.confirmed { color: var(--st-conf); background: var(--st-conf-bg); }
    .badge.postponed { color: var(--st-postpone); background: var(--st-postpone-bg); }
    .badge.no_answer { color: var(--st-noans); background: var(--st-noans-bg); }
    .badge.rejected { color: var(--st-rej); background: var(--st-rej-bg); }
    .badge.shipping { color: var(--st-ship); background: var(--st-ship-bg); }
    .badge.delivered { color: var(--st-deliv); background: var(--st-deliv-bg); }
    .badge.returned { color: var(--st-ret); background: var(--st-ret-bg); }

    .age-pip.ok { background: var(--teal-soft); color: var(--teal); }
    .age-pip.warn { background: var(--st-assign-bg); color: var(--st-assign); }
    .age-pip.late { background: var(--st-rej-bg); color: var(--st-rej); }

    /* ===================== MODAL / TOAST / LOADER ===================== */
    .modal-overlay { position: fixed; inset: 0; background: rgba(8,11,18,0.55); backdrop-filter: blur(4px); z-index: 999; display: flex; justify-content: center; align-items: center; padding: 1rem; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content { background: var(--surface); width: 100%; max-width: 500px; border-radius: var(--radius-xl); padding: 1.9rem; box-shadow: var(--shadow-float); transform: scale(0.96); transition: transform 0.25s; max-height: 90vh; overflow-y: auto; border:1px solid var(--border); }
    .modal-overlay.active .modal-content { transform: scale(1); }

    .img-upload { border: 2px dashed var(--border-strong); border-radius: var(--radius-md); padding: 1.8rem; text-align: center; cursor: pointer; transition: var(--transition); background: var(--surface-alt); position: relative; overflow: hidden; display:block; }
    .img-upload:hover { border-color: var(--primary); }
    .img-preview { width: 100%; height: 190px; object-fit: cover; border-radius: var(--radius-sm); display: none; }

    #toast-box { position: fixed; bottom: 1.6rem; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem; pointer-events: none; }
    .toast { background: var(--surface); color: var(--ink); padding: 0.9rem 1.3rem; border-radius: var(--radius-md); box-shadow: var(--shadow-float); font-weight: 700; font-size:0.9rem; display: flex; align-items: center; gap: 0.7rem; animation: fadeUp 0.25s ease; border: 1px solid var(--border); pointer-events: auto; }

    #global-loader { position: fixed; inset: 0; background: var(--bg); z-index: 99999; display: flex; justify-content: center; align-items: center; flex-direction: column; gap: 1.3rem; transition: opacity 0.4s; }
    .spinner { width: 42px; height: 42px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===================== FAB ===================== */
    .fab { position: fixed; bottom: 1.6rem; inset-inline-end: 1.6rem; width: 56px; height: 56px; border-radius: 50%; background: var(--primary); color: var(--primary-ink); border: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 28px -8px var(--primary-glow); cursor: pointer; z-index: 50; transition: var(--transition); }
    .fab:hover { filter: brightness(1.06); transform: translateY(-2px); }

    /* ===================== EMPTY STATES ===================== */
    .empty-state { text-align:center; padding: 3.2rem 1.5rem; }
    .empty-state .ic { width:56px; height:56px; margin:0 auto 1.1rem; color: var(--muted); opacity:0.5; }
    .empty-state h3 { color: var(--ink); margin-bottom:0.4rem; }

    /* product / team grids reuse .card */
    .prod-card { background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-lg); overflow:hidden; display:flex; flex-direction:column; box-shadow: var(--shadow-card); }
    .team-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.3rem; box-shadow: var(--shadow-card); }

    /* ===================== PRINT ===================== */
    .print-only { display:none; }
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { display:block !important; position: absolute; top:0; left:0; width:100%; padding:1.5rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
    }
  </style>
</head>
<body>

<div id="global-loader">
  <div class="spinner"></div>
  <h2 style="color: var(--primary)">جاري تجهيز غرفة العمليات...</h2>
</div>

<div id="toast-box"></div>
<div id="printArea" class="print-only"></div>

<div id="customModal" class="modal-overlay">
  <div class="modal-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.4rem;">
      <h2 id="modalTitle" style="margin:0;"></h2>
      <button class="btn-icon btn-secondary" onclick="closeModal()"><i data-lucide="x"></i></button>
    </div>
    <div id="modalBody" style="margin-bottom:1.7rem; line-height:1.7;"></div>
    <div id="modalActions" style="display:flex; gap:0.8rem; justify-content:flex-end;"></div>
  </div>
</div>

<main id="loginView" class="login-wrap hidden">
  <div class="login-visual">
    <div class="route-grid"></div>
    <svg viewBox="0 0 460 300" style="position:absolute; inset-inline-end:-40px; bottom:-20px; width:520px; opacity:0.9;">
      <path d="M20 260 C 120 220, 140 120, 240 110 S 400 40, 440 30" fill="none" stroke="#f0a93a" stroke-width="2.5" stroke-dasharray="7 8" opacity="0.55">
        <animate attributeName="stroke-dashoffset" from="0" to="-60" dur="3s" repeatCount="indefinite"/>
      </path>
      <circle cx="20" cy="260" r="7" fill="#2fd4c0"/>
      <circle cx="240" cy="110" r="6" fill="#f0a93a"/>
      <circle cx="440" cy="30" r="7" fill="#f0596b"/>
    </svg>
    <div class="login-visual-inner animate-in">
      <div class="route-badge"><span class="dot"></span> تتبّع لحظي لكل الطلبيات</div>
      <h1 style="font-size: 2.7rem; line-height:1.15; margin-bottom: 1.1rem;">غرفة تحكّم<br>الطلبيات والتأكيد</h1>

/* ---------- small time / aging helpers (client-side only, no schema changes) ---------- */
function agingInfo(ts, thresholds = {warn:120, late:360}) {
  if (!ts?.toDate) return null;
  const mins = Math.floor((Date.now() - ts.toDate().getTime()) / 60000);
  const text = mins < 60 ? `منذ ${mins} د` : (mins < 1440 ? `منذ ${Math.floor(mins/60)} س` : `منذ ${Math.floor(mins/1440)} ي`);
  const level = mins >= thresholds.late ? 'late' : (mins >= thresholds.warn ? 'warn' : 'ok');
  return { mins, text, level };
}

function showToast(msg, isError = false) {
  const box = $('toast-box'), t = document.createElement('div');
  t.className = 'toast';
  let iconColor = isError ? 'var(--st-rej)' : 'var(--teal)';
  t.innerHTML = `<i data-lucide="${isError ? 'alert-circle' : 'check-circle-2'}" style="color:${iconColor}"></i> <span>${msg}</span>`;
  box.appendChild(t); lucide.createIcons({root:t});
  setTimeout(() => { t.style.opacity=0; t.style.transform='translateY(20px)'; setTimeout(()=>t.remove(),300); }, 4000);
}

/* ---------- dashboard helpers: 7-day volume + priority queue + leaderboard (all computed client-side from existing fields) ---------- */
function last7DaysCounts(list) {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - i);
    days.push(d);
  }
  const counts = days.map(d => {
    const next = new Date(d); next.setDate(d.getDate()+1);
    return list.filter(o => { const c = o.createdAt?.toDate?.(); return c && c >= d && c < next; }).length;
  });
  const labels = days.map(d => d.toLocaleDateString('ar-MA', {weekday:'short'}));
  return { counts, labels };
}

function priorityQueue(list) {
  if (user.role === 'confirmer') {
    return list.filter(o => ['assigned','postponed','no_answer'].includes(o.status))
      .map(o => ({ o, age: agingInfo(o.status==='assigned' ? o.assignedAt : o.confirmedAt) }))
      .filter(x => x.age)
      .sort((a,b) => b.age.mins - a.age.mins).slice(0,5);
  }
  return list.filter(o => o.status === 'new')
    .map(o => ({ o, age: agingInfo(o.createdAt, {warn:30, late:120}) }))
    .filter(x => x.age)
    .sort((a,b) => b.age.mins - a.age.mins).slice(0,5);
}

function viewDashboard() {

  const { counts, labels } = last7DaysCounts(list);
  const maxC = Math.max(1, ...counts);
  const queue = priorityQueue(list);

  return `

      <div class="stat-card"><div class="bar" style="background:var(--st-deliv)"></div><div class="lbl"><i data-lucide="package-check" style="width:15px"></i> تم التوصيل بنجاح</div><div class="val" style="color:var(--st-deliv)">${deliv.length}</div></div>
      ${user.role==='manager' 
        ? `<div class="stat-card"><div class="bar" style="background:var(--teal)"></div><div class="lbl"><i data-lucide="wallet" style="width:15px"></i> إجمالي المداخيل</div><div class="val" style="color:var(--teal)">${money(rev)}</div></div>`
        : `<div class="stat-card"><div class="bar" style="background:var(--teal)"></div><div class="lbl"><i data-lucide="coins" style="width:15px"></i> مستحقاتي للقبض</div><div class="val" style="color:var(--teal)">${money(Math.max(0, deliv.length*PAY_PER_DELIVERY - Number(user.paidTotal||0)))}</div></div>`
      }
    </div>

    <div class="card">
      <h2 style="display:flex;align-items:center;gap:0.5rem;"><i data-lucide="trending-up" style="width:18px"></i> نشاط آخر 7 أيام</h2>
      <div class="sparkline">
        ${counts.map((c,i) => `
          <div class="bar-col">
            <span class="muted mono" style="font-size:0.7rem;">${c}</span>
            <div class="bar-fill ${i===6?'today':''}" style="height:${Math.max(6, (c/maxC)*56)}px;"></div>
            <span class="bar-lbl">${labels[i]}</span>
          </div>`).join('')}
      </div>
    </div>

    ${queue.length ? `
    <div class="card">
      <h2 style="display:flex;align-items:center;gap:0.5rem; color:var(--st-assign);"><i data-lucide="alarm-clock" style="width:18px"></i> ${user.role==='manager' ? 'طلبيات تحتاج إسناداً' : 'أولوية اليوم'}</h2>
      <div style="display:flex; flex-direction:column; gap:0.7rem;">
        ${queue.map(({o,age}) => `
          <div class="priority-item">
            <div style="flex:1; min-width:0;">
              <div style="font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(o.customerName)}</div>
              <div class="muted" style="font-size:0.8rem;">${esc(o.productName)} · ${esc(o.city)}</div>
            </div>
            <span class="age-pip ${age.level}">${age.text}</span>
            <a href="https://wa.me/${formatPhone(o.phone)}" target="_blank" class="icon-link" style="color:var(--wa-color);"><i data-lucide="message-circle" style="width:16px"></i></a>
          </div>`).join('')}
      </div>
    </div>` : ''}

    ${user.role==='manager' ? `
    <div class="card">
      <h2 style="display:flex;align-items:center;gap:0.5rem;"><i data-lucide="trophy" style="width:18px"></i> الأكثر تسليماً</h2>
      ${data.profiles.length ? `<div>${data.profiles.map(p => ({p, n: data.orders.filter(o=>o.confirmerId===p.id && o.status==='delivered').length}))

        <div class="lb-row">
          <div class="lb-rank">${i+1}</div>
          <div style="flex:1;">${esc(x.p.name)}</div>
          <strong class="mono" style="color:var(--st-deliv)">${x.n}</strong>
        </div>`).join('')}</div>` : '<p class="muted">لا يوجد أعضاء في الفريق بعد.</p>'}
    </div>` : ''}
    `;
}

window.curFilter = { text: '', status: '' };
function viewOrders() {

function orderCard(o) {

window.handleImageSelect = (input) => {
  if(input.files && input.files[0]) {
    const file = input.files[0];
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 600; 
        const scale = MAX_WIDTH / img.width;
        canvas.width = MAX_WIDTH; canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const base64 = canvas.toDataURL('image/jpeg', 0.6);
        $('prodImgBase64').value = base64;
        $('imgPreview').src = base64;
        $('imgPreview').style.display = 'block';
        $('uploadIcon').style.display = 'none';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
};

function viewAnalytics() {
  if (user.role !== 'manager') return '';

  let html = `<div style="margin-bottom:1.3rem;"><h2 style="display:flex;align-items:center;gap:0.5rem;"><i data-lucide="bar-chart-2" style="color:var(--primary); width:19px;"></i> تحليل أداء فريق التأكيد</h2><p class="muted">تتبع سرعة ونشاط فريق العمل لاتخاذ قرارات أفضل في تجارتك.</p></div>`;

  let cards = data.profiles.map(p => {
    let myOrds = data.orders.filter(o => o.confirmerId === p.id);
    let totalAssigned = myOrds.length;
    let confirmedCount = myOrds.filter(o => ['confirmed', 'shipping', 'delivered'].includes(o.status)).length;
    let rejectedCount = myOrds.filter(o => o.status === 'rejected').length;
    let postponeCount = myOrds.filter(o => o.status === 'postponed').length;

    let confRate = totalAssigned ? Math.round((confirmedCount / totalAssigned) * 100) : 0;

    let timeOrders = myOrds.filter(o => o.assignedAt && o.confirmedAt);
    let totalMins = 0;
    timeOrders.forEach(o => {
       let a = o.assignedAt?.toDate?.();
       let c = o.confirmedAt?.toDate?.();
       if(a && c) totalMins += (c - a) / 60000;
    });
    let avgMins = timeOrders.length ? Math.round(totalMins / timeOrders.length) : 0;
    let avgTimeStr = avgMins === 0 ? 'غير محدد' : (avgMins > 60 ? `${(avgMins/60).toFixed(1)} ساعة` : `${avgMins} دقيقة`);

    let logins = p.loginCount || 0;
    let lastLog = p.lastLogin ? fmt(p.lastLogin) : 'لم يسجل الدخول';
    let ringColor = confRate >= 70 ? 'var(--st-deliv)' : (confRate >= 40 ? 'var(--st-assign)' : 'var(--st-rej)');

    return `
      <div class="team-card">
         <div style="display:flex; align-items:center; gap:0.9rem; margin-bottom:1.3rem; border-bottom:1px dashed var(--border); padding-bottom:0.9rem;">
            <div class="ring" style="--pct:${confRate}; --ring-c:${ringColor};"><div class="ring-hole">${confRate}%</div></div>
            <div>
              <h3 style="margin:0;">${esc(p.name)}</h3>
              <div class="muted" style="font-size:0.78rem; margin-top:0.2rem;">آخر ظهور: <strong dir="ltr" class="mono">${lastLog}</strong></div>
            </div>
         </div>

         <div style="display:grid; grid-template-columns:1fr; gap:0.7rem; margin-bottom:1.1rem;">
            <div style="background:var(--surface-alt); padding:0.8rem; border-radius:var(--radius-sm); display:flex; justify-content:space-between; align-items:center; border:1px solid var(--border);">
               <span class="muted" style="font-size:0.85rem;">متوسط سرعة الرد</span>
               <strong class="mono" style="color:var(--st-assign);">${avgTimeStr}</strong>
            </div>
         </div>

         <div style="display:flex; justify-content:space-between; font-size:0.83rem; padding:0.75rem; background:var(--surface-alt); border-radius:var(--radius-sm); border:1px solid var(--border);">
            <div><span class="muted">أُسندت إليه:</span> <strong class="mono">${totalAssigned}</strong></div>
            <div><span class="muted" style="color:var(--st-rej)">إلغاء:</span> <strong class="mono">${rejectedCount}</strong></div>
            <div><span class="muted" style="color:var(--st-postpone)">تأجيل:</span> <strong class="mono">${postponeCount}</strong></div>
         </div>

         <div style="margin-top:0.9rem; font-size:0.83rem; text-align:center; color:var(--muted); background:var(--surface-alt); padding:0.5rem; border-radius:var(--radius-sm);">
            <i data-lucide="log-in" style="width:14px; vertical-align:middle;"></i> سجل الدخول للتطبيق: <strong class="mono">${logins}</strong> مرات
         </div>
      </div>
    `;
  });

  return html + `<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:1.1rem;">${cards.length ? cards.join('') : '<p class="muted">لا توجد بيانات للفريق حتى الآن.</p>'}</div>`;
}

function bindForms() {
  let fOrd = $('orderForm');
  if(fOrd) { updPreview();
  fOrd.onsubmit = async e => {
    e.preventDefault(); let btn = e.submitter; btn.disabled=true;
    try {
      let fd = new FormData(fOrd);
      let p = data.products.find(i=>i.id===fd.get('productId')), q = Number(fd.get('qty'));
      let confId = fd.get('confirmerId');
      let confName = confId ? data.profiles.find(x=>x.id===confId)?.name : null;
      let st = confId ? 'assigned' : 'new';

      await addDoc(collection(db, 'orders'), { 
        customerName: fd.get('customerName').trim(), phone: fd.get('phone').trim(), city: fd.get('city').trim(), 
        productId: p.id, productName: p.name, unitPrice: Number(p.price), qty: q, total: Number(p.price)*q, 
        status: st, confirmerId: confId || null, confirmerName: confName || null, assignedAt: confId ? serverTimestamp() : null,
        createdAt: serverTimestamp() 
      });
      fOrd.reset(); showToast('تم إضافة الطلبية بنجاح'); setTab('orders');
    } catch(err) { showToast('حدث خطأ: ' + err.message, true); btn.disabled=false; }
  };}

  let fPrd = $('productForm');
  if(fPrd) fPrd.onsubmit = async e => {
    e.preventDefault(); let btn = e.submitter; btn.disabled=true;
    try {
      let fd = new FormData(fPrd);
      await addDoc(collection(db, 'products'), { 
        name: fd.get('name').trim(), price: Number(fd.get('price')), 
        description: fd.get('description').trim(), strategy: fd.get('strategy').trim(),
        image: fd.get('imageBase64') || null,
        createdAt: serverTimestamp() 
      });
      fPrd.reset(); $('imgPreview').style.display='none'; $('uploadIcon').style.display='block'; $('prodImgBase64').value='';
      showToast('تم حفظ المنتج بنجاح'); btn.disabled=false;
    } catch(err) { showToast('خطأ في الحفظ', true); btn.disabled=false; }
  };

  let fPrf = $('profileForm');
  if(fPrf) fPrf.onsubmit = async e => {
    e.preventDefault(); let btn = e.submitter; btn.disabled=true;
    try {
      let fd = new FormData(fPrf);
      await addDoc(collection(db, 'profiles'), { name: fd.get('name').trim(), code: fd.get('code'), permissions: fd.getAll('permissions'), paidTotal: 0, loginCount: 0, createdAt: serverTimestamp() });
      fPrf.reset(); showToast('تم إنشاء الحساب بنجاح'); btn.disabled=false;
    } catch(err) { showToast('خطأ في الإنشاء', true); btn.disabled=false; }
  };
}

window.assignOrder = async (id, pid) => { if(pid) { await updateDoc(doc(db,'orders',id),{confirmerId:pid, status:'assigned', assignedAt:serverTimestamp()}); showToast('تم إسناد الطلبية'); }};
window.changeStatus = async (id, st) => { if(st) { await updateDoc(doc(db,'orders',id),{status:st}); showToast('تم تحديث حالة الطلبية'); }};
window.doConfirm = async (id, st) => { let note = $(`n-${id}`)?.value.trim()||''; await updateDoc(doc(db,'orders',id),{status:st, confirmationNote:note, confirmedAt:serverTimestamp()}); showToast('تم تسجيل ردك بنجاح'); };

window.askDelOrder = (id) => askConfirm('حذف الطلبية', 'هل أنت متأكد من رغبتك في حذف هذه الطلبية نهائياً من قاعدة البيانات؟ لا يمكن التراجع عن هذا الإجراء.', async () => { await deleteDoc(doc(db,'orders',id)); showToast('تم حذف الطلبية نهائياً'); });
window.askDelProd = (id) => askConfirm('حذف المنتج', 'هل أنت متأكد من رغبتك في حذف هذا المنتج نهائياً من المستودع؟', async () => { await updateDoc(doc(db,'products',id),{deleted:true}); showToast('تم الحذف'); });
window.askDelProf = (id) => askConfirm('حذف الحساب', 'هل تريد فعلاً حذف حساب هذا المؤكد؟ لن يتم حذف تاريخ طلبياته.', async () => { await updateDoc(doc(db,'profiles',id),{archived:true}); showToast('تم الحذف'); });
window.askPayProf = (id) => {
  let p = data.profiles.find(x=>x.id===id);
  window.tempPay = async () => {
    let amt = Number($('payAmountInp').value);
    if(amt > 0) { await updateDoc(doc(db,'profiles',id),{paidTotal: Number(p.paidTotal||0) + amt}); showToast('تم تسجيل الدفعة'); closeModal(); }
  };
  showModal('تسجيل دفعة مالية', `<p>أدخل المبلغ الذي قمت بدفعه للمؤكد <strong>${esc(p.name)}</strong> الآن:</p><div class="input-group"><input type="number" id="payAmountInp" placeholder="المبلغ بـ د.م" min="1"></div>`, `<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button><button class="btn btn-primary" onclick="tempPay()">تسجيل وحفظ</button>`);
};

start();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
