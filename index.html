<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>إدارة الطلبيات</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2558d9">
  <style>
    :root{--ink:#17233c;--blue:#2558d9;--mint:#0b9b7c;--bg:#f4f7fc;--line:#dfe6f2;--danger:#c33a4b;--warn:#c87508}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:bold}button.secondary{background:#e8eefb;color:#254477}button.danger{background:#f9e7e9;color:var(--danger)}button.success{background:var(--mint)}button:disabled{opacity:.55;cursor:not-allowed}.screen{max-width:1180px;margin:auto;padding:25px}.login{max-width:480px;margin:7vh auto}.brand{font-size:28px;font-weight:bold;color:var(--blue);margin-bottom:7px}.muted{color:#66748a;font-size:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 5px 18px #20355b0a;margin:14px 0}.choice{display:flex;gap:12px}.choice button{flex:1;padding:18px}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}.top h1{font-size:22px;margin:0}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.tabs button{background:#fff;color:#53627a;border:1px solid var(--line)}.tabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.stat{background:#fff;border-radius:14px;padding:17px;border:1px solid var(--line)}.stat b{display:block;color:#66748a;font-size:13px;margin-bottom:7px}.stat strong{font-size:25px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:bold}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #cdd7e8;border-radius:9px;background:#fff;color:var(--ink)}.field textarea{min-height:76px;resize:vertical}.wide{grid-column:span 3}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{text-align:right;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}.table th{color:#62728a;font-size:12px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf1f8;color:#40506a;font-size:12px;white-space:nowrap}.badge.delivered,.badge.confirmed{background:#daf3e9;color:#087057}.badge.rejected{background:#fae3e5;color:#a42638}.badge.shipping{background:#dfeaff;color:#2455b9}.badge.assigned{background:#fff0d6;color:#a75c00}.order-actions{min-width:190px}.order-actions select{width:100%;margin:3px 0;padding:7px;border-radius:7px;border:1px solid var(--line)}.notice{padding:11px 14px;border-radius:10px;background:#fff5dd;color:#805000;margin:12px 0}.ok{background:#e0f5eb;color:#087057}.profile{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:12px 0;gap:10px}.profile:last-child{border:0}@media(max-width:760px){.screen{padding:16px}.grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.top{align-items:flex-start;flex-direction:column}.choice{flex-direction:column}}
  </style>
</head>
<body>
<main id="loginView" class="screen login">
  <div class="brand">طلباتك</div><p class="muted">مساحة بسيطة لإدارة الطلبيات وفريق التأكيد.</p>
  <section id="roleChoice" class="card"><h2>من أنت؟</h2><div class="choice"><button onclick="chooseRole('manager')">أنا المدير</button><button class="success" onclick="chooseRole('confirmer')">أنا تأكيد الطلبيات</button></div></section>
  <section id="managerLogin" class="card hidden"><h2>دخول المدير</h2><label class="field">كود المدير<input id="managerCode" type="password" inputmode="numeric" autocomplete="off"></label><div class="actions"><button onclick="loginManager()">دخول</button><button class="secondary" onclick="backRole()">رجوع</button></div></section>
  <section id="confirmerLogin" class="card hidden"><h2>دخول تأكيد الطلبيات</h2><label class="field">اختاري البروفايل<select id="profileSelect"></select></label><label class="field">الكود الخاص بك<input id="profileCode" type="password" autocomplete="off"></label><div class="actions"><button class="success" onclick="loginConfirmer()">دخول</button><button class="secondary" onclick="backRole()">رجوع</button></div></section>
  <p id="loginMessage" class="muted"></p>
</main>

<main id="appView" class="screen hidden">
  <header class="top"><div><h1>طلباتك</h1><div id="who" class="muted"></div></div><button class="secondary" onclick="logout()">خروج</button></header>
  <div id="alertBox" class="notice hidden"></div><nav id="tabs" class="tabs"></nav><section id="content"></section>
</main>

<script type="module">
/* 1) أنشئي مشروع Firebase مجاني، ثم استبدلي القيم التالية من إعدادات Web app. */
const firebaseConfig = {
  apiKey: "AIzaSyDNL9HKom4WCNK8zMC-tOBYzH5uM1L4kDU", authDomain: "orders-team-25634.firebaseapp.com",
  projectId: "orders-team-25634", storageBucket: "orders-team-25634.firebasestorage.app",
  messagingSenderId: "285601621203", appId: "1:285601621203:web:c22025ca3569a1beaf2026"
};
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,addDoc,setDoc,updateDoc,onSnapshot,serverTimestamp,query,orderBy} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const MANAGER_CODE="7424623008", PAY_PER_DELIVERY=10;
let db, data={profiles:[],products:[],orders:[]}, user=null, tab="dashboard", unsub=[];
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>`${Number(n||0).toFixed(2)} د.م`;
const fmt=t=>t?.toDate? t.toDate().toLocaleString('ar-MA') : (t?new Date(t).toLocaleString('ar-MA'):'—');
const stateName={new:'جديدة',assigned:'بانتظار التأكيد',confirmed:'تم التأكيد',rejected:'لم يتم التأكيد',shipping:'في الشحن',delivered:'وصلت للعميل'};
function saveError(e){console.error(e);alert('تعذر الحفظ. تأكد من اتصال الإنترنت ثم حدّث الصفحة. ('+(e?.message||'خطأ غير معروف')+')')}
function configured(){return !firebaseConfig.apiKey.startsWith('PUT_')}
function start(){
 if(!configured()){$('loginMessage').textContent='ضعي إعدادات Firebase الخمسة داخل الكود أولاً، ثم ارفعي الملف.';return}
 db=getFirestore(initializeApp(firebaseConfig));
 ['profiles','products','orders'].forEach(name=>{unsub.push(onSnapshot(query(collection(db,name),orderBy('createdAt','desc')),snap=>{data[name]=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>!x.deleted&&!x.archived); if(name==='profiles') fillProfiles(); if(user) render();}));});
}
function fillProfiles(){const s=$('profileSelect');s.innerHTML=data.profiles.length?'<option value="">— اختاري اسمك —</option>'+data.profiles.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join(''):'<option>لا يوجد بروفايل بعد</option>'}
window.chooseRole=role=>{$('roleChoice').classList.add('hidden');$(role==='manager'?'managerLogin':'confirmerLogin').classList.remove('hidden')};
window.backRole=()=>{['managerLogin','confirmerLogin'].forEach(id=>$(id).classList.add('hidden'));$('roleChoice').classList.remove('hidden')};
window.loginManager=()=>{if($('managerCode').value!==MANAGER_CODE)return $('loginMessage').textContent='الكود غير صحيح.'; user={role:'manager',name:'المدير'};openApp()};
window.loginConfirmer=()=>{let p=data.profiles.find(x=>x.id===$('profileSelect').value);if(!p||$('profileCode').value!==p.code)return $('loginMessage').textContent='الاسم أو الكود غير صحيح.';user={role:'confirmer',...p};openApp()};
function openApp(){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('who').textContent=`مرحباً ${user.name} · ${user.role==='manager'?'مدير النظام':'تأكيد الطلبيات'}`; notifyAssigned();render()}
window.logout=()=>{user=null;$('appView').classList.add('hidden');$('loginView').classList.remove('hidden');$('managerCode').value=$('profileCode').value='';backRole()};
function allowed(key){return user.role==='manager'||(user.permissions||[]).includes(key)}
function tabs(){let a=[['dashboard','لوحة التحكم'],['orders','الطلبيات']];if(allowed('newOrder'))a.push(['neworder','طلبية جديدة']);if(allowed('products'))a.push(['products','المنتجات']);if(user.role==='manager')a.push(['team','الفريق']);return a}
function render(){if(!user)return;$('tabs').innerHTML=tabs().map(([id,n])=>`<button class="${tab===id?'active':''}" onclick="setTab('${id}')">${n}</button>`).join('');let f={dashboard:viewDashboard,orders:viewOrders,neworder:viewNewOrder,products:viewProducts,team:viewTeam}[tab]||viewDashboard;$('content').innerHTML=f();bindForms()}
window.setTab=t=>{tab=t;render()};
function myOrders(){return user.role==='manager'?data.orders:data.orders.filter(o=>o.confirmerId===user.id)}
function delivered(list){return list.filter(o=>o.status==='delivered')}
function viewDashboard(){let list=myOrders(), deliveredOrders=delivered(list), revenue=deliveredOrders.reduce((s,o)=>s+Number(o.total||0),0);let today=new Date().toDateString(), todayN=list.filter(o=>o.createdAt?.toDate?.().toDateString()===today).length;let extra=user.role==='confirmer'?`<div class="stat"><b>مستحقاتك الحالية</b><strong>${money(Math.max(0,deliveredOrders.length*PAY_PER_DELIVERY-Number(user.paidTotal||0)))}</strong><small class="muted">${deliveredOrders.length} طلبية وصلت × 10 د.م</small></div>`:'';let due=list.filter(o=>o.status==='assigned'&&Date.now()-(o.assignedAt?.toDate?.()||new Date())>=900000);return `<div class="grid"><div class="stat"><b>طلبيات اليوم</b><strong>${todayN}</strong></div><div class="stat"><b>إجمالي طلبياتي</b><strong>${list.length}</strong></div><div class="stat"><b>الطلبيات التي وصلت</b><strong>${deliveredOrders.length}</strong></div>${user.role==='manager'?`<div class="stat"><b>مداخيل الطلبات الواصلة</b><strong>${money(revenue)}</strong></div>`:extra}</div>${due.length?`<div class="notice"><b>لديك ${due.length} طلبية جاهزة للتأكيد الآن.</b> مرّت 15 دقيقة على إسنادها. افتحي «الطلبيات» لتأكيدها.</div>`:''}<div class="card"><h2>آخر الطلبيات</h2>${smallOrderTable(list.slice(0,5))}</div>`}
function smallOrderTable(list){return list.length?`<div class="table-wrap"><table class="table"><thead><tr><th>العميل</th><th>المنتج</th><th>الحالة</th><th>الوقت</th></tr></thead><tbody>${list.map(o=>`<tr><td>${esc(o.customerName)}<br><span class="muted">${esc(o.city)}</span></td><td>${esc(o.productName)} × ${o.qty}</td><td><span class="badge ${o.status}">${stateName[o.status]}</span></td><td>${fmt(o.createdAt)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">لا توجد طلبيات بعد.</p>'}
function viewNewOrder(){if(!data.products.length)return `<div class="card"><h2>طلبية جديدة</h2><p>أضيفي منتجاً أولاً من صفحة المنتجات.</p></div>`;return `<div class="card"><h2>إضافة طلبية جديدة</h2><form id="orderForm" class="form-grid"><label class="field">اسم العميل<input name="customerName" required></label><label class="field">رقم الهاتف<input name="phone" required inputmode="tel"></label><label class="field">المدينة<input name="city" required></label><label class="field">المنتج<select name="productId" required>${data.products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)}</option>`).join('')}</select></label><label class="field">الكمية<input name="qty" type="number" min="1" value="1" required></label><div class="field"><span>السعر</span><span class="muted">يُحفظ تلقائياً حسب المنتج</span></div><div class="wide actions"><button>حفظ الطلبية</button></div></form></div>`}
function viewProducts(){return `<div class="card">${allowed('products')?`<h2>إضافة منتج</h2><form id="productForm" class="form-grid"><label class="field">اسم المنتج<input name="name" required></label><label class="field">السعر (د.م)<input name="price" type="number" min="0" step="0.01" required></label><div class="field" style="justify-content:end"><button>إضافة المنتج</button></div></form>`:''}<h2>المنتجات</h2>${data.products.length?`<div class="table-wrap"><table class="table"><thead><tr><th>المنتج</th><th>السعر</th><th></th></tr></thead><tbody>${data.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${money(p.price)}</td><td>${user.role==='manager'?`<button class="danger" onclick="deleteProduct('${p.id}')">حذف</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">لا توجد منتجات.</p>'}</div>`}
function viewOrders(){let list=myOrders();return `<div class="card"><h2>كل الطلبيات</h2>${list.length?`<div class="table-wrap"><table class="table"><thead><tr><th>العميل</th><th>المنتج / المبلغ</th><th>التأكيد</th><th>الحالة</th><th>التحكم</th></tr></thead><tbody>${list.map(orderRow).join('')}</tbody></table></div>`:'<p class="muted">لا توجد طلبيات.</p>'}</div>`}
function orderRow(o){
 let p=data.profiles.find(p=>p.id===o.confirmerId), canConfirm=user.role==='confirmer'&&o.status==='assigned';
 let elapsed=Date.now()-(o.assignedAt?.toDate?.()||new Date()), wait=canConfirm&&elapsed<900000;
 let assignment=`<select onchange="assignOrder('${o.id}',this.value)"><option value="">${o.status==='new'?'— أسنديها للتأكيد —':esc(p?.name||'غير مسندة')}</option>${data.profiles.map(x=>`<option value="${x.id}" ${o.confirmerId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`;
 let shipping=`<select onchange="changeStatus('${o.id}',this.value)"><option value="">غيّري حالة الشحن</option>${o.status==='confirmed'?'<option value="shipping">تم وضعها للشحن</option>':''}${o.status==='shipping'?'<option value="delivered">وصلت للعميل</option>':''}</select>`;
 let managerControls=user.role==='manager'?assignment+shipping:'';
 let confirmerControls='';
 if(canConfirm) confirmerControls=wait?`<span class="muted">متاح بعد ${Math.max(1,Math.ceil((900000-elapsed)/60000))} د</span>`:`<textarea id="note-${o.id}" placeholder="تعليق للمدير (اختياري)"></textarea><div class="actions"><button class="success" onclick="confirmOrder('${o.id}','confirmed')">تم التأكيد</button><button class="danger" onclick="confirmOrder('${o.id}','rejected')">لم يتم التأكيد</button></div>`;
 return `<tr><td><b>${esc(o.customerName)}</b><br>${esc(o.phone)}<br><span class="muted">${esc(o.city)} · ${fmt(o.createdAt)}</span></td><td>${esc(o.productName)} × ${o.qty}<br><b>${money(o.total)}</b></td><td>${esc(p?.name||'غير مسندة')}${o.confirmationNote?`<br><span class="muted">ملاحظة: ${esc(o.confirmationNote)}</span>`:''}</td><td><span class="badge ${o.status}">${stateName[o.status]}</span></td><td class="order-actions">${managerControls}${confirmerControls}</td></tr>`
}
function viewTeam(){let rows=data.profiles.map(p=>{let d=delivered(data.orders.filter(o=>o.confirmerId===p.id));let earned=d.length*PAY_PER_DELIVERY, due=Math.max(0,earned-Number(p.paidTotal||0));return `<div class="profile"><div><b>${esc(p.name)}</b><div class="muted">صلاحيات: ${(p.permissions||[]).map(permissionName).join('، ')||'الطلبيات فقط'}</div><div>وصلت: ${d.length} · المستحق: <b>${money(due)}</b> · تم دفعه: ${money(p.paidTotal||0)}</div></div><div class="actions"><button class="secondary" onclick="payProfile('${p.id}')">تسجيل دفعة</button><button class="danger" onclick="deleteProfile('${p.id}')">حذف</button></div></div>`}).join('')||'<p class="muted">لم يتم إنشاء أي بروفايل بعد.</p>';return `<div class="card"><h2>إنشاء بروفايل لتأكيد الطلبيات</h2><form id="profileForm" class="form-grid"><label class="field">الاسم<input name="name" required></label><label class="field">الكود الخاص بها<input name="code" required></label><label class="field">الصلاحيات<div><label><input type="checkbox" name="permissions" value="newOrder"> إضافة طلبية</label><br><label><input type="checkbox" name="permissions" value="products"> المنتجات</label></div></label><div class="wide"><button>إنشاء البروفايل</button></div></form></div><div class="card"><h2>فريق التأكيد والمستحقات</h2>${rows}</div>`}
function permissionName(k){return k==='newOrder'?'إضافة طلبية':k==='products'?'المنتجات':k}
function bindForms(){let f=$('orderForm');if(f)f.onsubmit=async e=>{e.preventDefault();let form=e.currentTarget;try{let x=Object.fromEntries(new FormData(form)),p=data.products.find(p=>p.id===x.productId),q=Number(x.qty);await addDoc(collection(db,'orders'),{customerName:x.customerName.trim(),phone:x.phone.trim(),city:x.city.trim(),productId:p.id,productName:p.name,unitPrice:Number(p.price),qty:q,total:Number(p.price)*q,status:'new',createdAt:serverTimestamp()});form.reset();alert('تم حفظ الطلبية')}catch(err){saveError(err)}};f=$('productForm');if(f)f.onsubmit=async e=>{e.preventDefault();let form=e.currentTarget;try{let x=Object.fromEntries(new FormData(form));await addDoc(collection(db,'products'),{name:x.name.trim(),price:Number(x.price),createdAt:serverTimestamp()});form.reset();alert('تم حفظ المنتج')}catch(err){saveError(err)}};f=$('profileForm');if(f)f.onsubmit=async e=>{e.preventDefault();let form=e.currentTarget;try{let fd=new FormData(form), perms=fd.getAll('permissions');await addDoc(collection(db,'profiles'),{name:fd.get('name').trim(),code:fd.get('code'),permissions:perms,paidTotal:0,createdAt:serverTimestamp()});form.reset();alert('تم إنشاء البروفايل')}catch(err){saveError(err)}}}
window.assignOrder=async(id,pid)=>{if(!pid)return;let p=data.profiles.find(x=>x.id===pid);await updateDoc(doc(db,'orders',id),{confirmerId:pid,confirmerName:p.name,status:'assigned',assignedAt:serverTimestamp()});alert(`تم إسناد الطلبية إلى ${p.name}. ستظهر لها فوراً عند فتح التطبيق.`)};
window.changeStatus=async(id,status)=>{if(status)await updateDoc(doc(db,'orders',id),{status})};
window.confirmOrder=async(id,status)=>{let note=$(`note-${id}`)?.value.trim()||'';await updateDoc(doc(db,'orders',id),{status,confirmationNote:note,confirmedAt:serverTimestamp()})};
window.deleteProduct=async id=>{if(confirm('حذف المنتج؟')) await updateDoc(doc(db,'products',id),{deleted:true})};
window.deleteProfile=async id=>{if(confirm('حذف البروفايل؟ لن يُحذف سجل طلبياته.')) await updateDoc(doc(db,'profiles',id),{archived:true})};
window.payProfile=async id=>{let p=data.profiles.find(x=>x.id===id), amount=prompt(`كم دفعتِ إلى ${p.name}؟\nالمسجل سابقاً: ${money(p.paidTotal||0)}`);if(amount===null)return;amount=Number(amount);if(!Number.isFinite(amount)||amount<0)return alert('أدخلي مبلغاً صحيحاً.');await updateDoc(doc(db,'profiles',id),{paidTotal:Number(p.paidTotal||0)+amount})};
function notifyAssigned(){if(user?.role!=='confirmer')return;let n=data.orders.filter(o=>o.confirmerId===user.id&&o.status==='assigned').length;if(n){$('alertBox').textContent=`لديك ${n} طلبية جديدة بانتظار التأكيد.`;$('alertBox').classList.remove('hidden');if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();if('Notification'in window&&Notification.permission==='granted')new Notification('طلباتك',{body:'هناك طلبية جديدة، ادخلي للتأكيد الآن.'})}}
 start();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
