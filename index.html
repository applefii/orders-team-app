<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>طلباتك - النظام الاحترافي</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="https://i.postimg.cc/fTg000hC/13089187.png">
  <meta name="theme-color" content="#111827">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');

    :root {
      /* Premium Dark/Light Palette */
      --primary: #6366f1; --primary-hover: #4f46e5;
      --bg-body: #f3f4f6; --bg-card: #ffffff;
      --text-main: #111827; --text-muted: #6b7280;
      --border: #e5e7eb;
      
      /* Rich Status Colors */
      --st-new: #9ca3af; --st-new-bg: #f3f4f6;
      --st-assign: #f59e0b; --st-assign-bg: #fef3c7;
      --st-conf: #10b981; --st-conf-bg: #d1fae5;
      --st-postpone: #8b5cf6; --st-postpone-bg: #ede9fe;
      --st-noans: #f97316; --st-noans-bg: #ffedd5;
      --st-rej: #ef4444; --st-rej-bg: #fee2e2;
      --st-ship: #3b82f6; --st-ship-bg: #dbeafe;
      --st-deliv: #059669; --st-deliv-bg: #a7f3d0;
      --st-ret: #be123c; --st-ret-bg: #ffe4e6;
      
      --wa-color: #25D366;
      
      --radius-xl: 24px; --radius-lg: 16px; --radius-md: 12px; --radius-sm: 8px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --primary: #818cf8; --primary-hover: #6366f1;
      --bg-body: #0f172a; --bg-card: #1e293b;
      --text-main: #f9fafb; --text-muted: #9ca3af;
      --border: #334155;
      
      --st-new-bg: rgba(156, 163, 175, 0.2);
      --st-assign-bg: rgba(245, 158, 11, 0.2);
      --st-conf-bg: rgba(16, 185, 129, 0.2);
      --st-postpone-bg: rgba(139, 92, 246, 0.2);
      --st-noans-bg: rgba(249, 115, 22, 0.2);
      --st-rej-bg: rgba(239, 68, 68, 0.2);
      --st-ship-bg: rgba(59, 130, 246, 0.2);
      --st-deliv-bg: rgba(5, 150, 105, 0.2);
      --st-ret-bg: rgba(190, 18, 60, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg-body); color: var(--text-main); transition: background-color 0.3s; padding-bottom: 2rem; }
    
    /* Animations */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: fadeUp 0.4s ease forwards; }
    
    /* Typography */
    h1 { font-size: 1.75rem; font-weight: 900; }
    h2 { font-size: 1.25rem; font-weight: 800; margin-bottom: 1rem; }
    .muted { color: var(--text-muted); font-size: 0.9rem; }
    .price-tag { color: var(--primary); font-weight: 900; font-size: 1.1rem; }

    /* Layout */
    .container { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }
    .hidden { display: none !important; }
    
    /* Cards */
    .card {
      background: var(--bg-card); border-radius: var(--radius-lg); padding: 1.5rem;
      box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 1.5rem;
      transition: var(--transition);
    }
    .card:hover { box-shadow: var(--shadow-md); }

    /* Forms & Inputs */
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; }
    .input-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .input-group label { font-weight: 700; font-size: 0.95rem; color: var(--text-main); }
    input, select, textarea {
      width: 100%; padding: 0.875rem 1rem; border-radius: var(--radius-md);
      border: 1.5px solid var(--border); background: var(--bg-body); color: var(--text-main);
      font-size: 1rem; font-weight: 500; transition: var(--transition);
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
    
    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      padding: 0.875rem 1.5rem; border-radius: var(--radius-md); font-weight: 800;
      border: none; cursor: pointer; transition: var(--transition); font-size: 1rem;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); box-shadow: 0 4px 12px rgba(99,102,241,0.3); }
    .btn-secondary { background: var(--bg-body); color: var(--text-main); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); }
    .btn-success { background: var(--st-conf); color: white; }
    .btn-danger { background: var(--st-rej); color: white; }
    .btn-icon { padding: 0.5rem; border-radius: var(--radius-sm); }
    
    /* Order Data Cards (The Responsive Magic) */
    .data-list { display: flex; flex-direction: column; gap: 1rem; }
    .data-card {
      background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border);
      padding: 1rem; display: flex; flex-direction: column; gap: 1rem;
      box-shadow: var(--shadow-sm); transition: var(--transition);
    }
    .data-card:hover { border-color: var(--primary); box-shadow: var(--shadow-md); }
    
    .dc-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px dashed var(--border); padding-bottom: 0.75rem; }
    .dc-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 0.2rem; }
    .dc-date { font-size: 0.8rem; color: var(--text-muted); }
    
    .dc-grid { display: grid; grid-template-columns: 1fr; gap: 0.75rem; }
    .dc-item { display: flex; align-items: center; gap: 0.75rem; font-size: 0.95rem; }
    .dc-icon { color: var(--text-muted); display: flex; align-items: center; justify-content: center; background: var(--bg-body); padding: 0.4rem; border-radius: var(--radius-sm); }
    
    .dc-actions { display: flex; flex-direction: column; gap: 0.5rem; border-top: 1px dashed var(--border); padding-top: 1rem; margin-top: 0.5rem; }
    .action-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .action-btn { flex: 1; padding: 0.6rem; font-size: 0.85rem; font-weight: 700; border-radius: var(--radius-sm); text-align: center; border: 1px solid transparent; cursor: pointer; transition: var(--transition); }
    
    /* Status Badges */
    .badge { padding: 0.4rem 0.75rem; border-radius: 99px; font-size: 0.8rem; font-weight: 800; display: inline-flex; align-items: center; gap: 0.3rem; white-space: nowrap; }
    .badge.new { color: var(--st-new); background: var(--st-new-bg); }
    .badge.assigned { color: var(--st-assign); background: var(--st-assign-bg); }
    .badge.confirmed { color: var(--st-conf); background: var(--st-conf-bg); }
    .badge.postponed { color: var(--st-postpone); background: var(--st-postpone-bg); }
    .badge.no_answer { color: var(--st-noans); background: var(--st-noans-bg); }
    .badge.rejected { color: var(--st-rej); background: var(--st-rej-bg); }
    .badge.shipping { color: var(--st-ship); background: var(--st-ship-bg); }
    .badge.delivered { color: var(--st-deliv); background: var(--st-deliv-bg); }
    .badge.returned { color: var(--st-ret); background: var(--st-ret-bg); }

    /* Desktop View for Data Cards */
    @media (min-width: 1024px) {
      .data-card { flex-direction: row; align-items: center; padding: 1.25rem; }
      .dc-header { border-bottom: none; border-left: 1px dashed var(--border); padding-bottom: 0; padding-left: 1.5rem; min-width: 220px; flex-direction: column; justify-content: center; }
      .dc-grid { grid-template-columns: repeat(3, 1fr); flex: 1; padding: 0 1.5rem; border-left: 1px dashed var(--border); }
      .dc-actions { border-top: none; padding-top: 0; margin-top: 0; min-width: 280px; }
      .action-row { justify-content: flex-end; }
    }

    /* Topbar & Tabs */
    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; background: var(--bg-card); border-radius: var(--radius-lg); margin-bottom: 1.5rem; box-shadow: var(--shadow-sm); position: sticky; top: 1rem; z-index: 100; border: 1px solid var(--border); }
    .tabs { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn { padding: 0.75rem 1.25rem; border-radius: var(--radius-md); border: none; background: transparent; color: var(--text-muted); font-weight: 700; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 0.5rem; transition: var(--transition); }
    .tab-btn.active { background: var(--bg-card); color: var(--primary); box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
    
    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card { background: var(--bg-card); padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.5rem; }
    .stat-val { font-size: 2rem; font-weight: 900; line-height: 1; }

    /* Toast */
    #toast-box { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem; }
    .toast { background: var(--bg-card); color: var(--text-main); padding: 1rem 1.5rem; border-radius: var(--radius-md); box-shadow: var(--shadow-lg); font-weight: 700; border-right: 4px solid var(--primary); display: flex; align-items: center; gap: 0.75rem; animation: fadeUp 0.3s ease; }
    
    /* Login */
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), var(--bg-body)); }
    .login-box { width: 100%; max-width: 420px; background: var(--bg-card); padding: 2.5rem 2rem; border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); border: 1px solid var(--border); text-align: center; }

    /* Loader */
    #global-loader { position: fixed; inset: 0; background: var(--bg-body); z-index: 99999; display: flex; justify-content: center; align-items: center; flex-direction: column; gap: 1rem; transition: opacity 0.4s; }
    .spinner { border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; width: 48px; height: 48px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="global-loader">
  <div class="spinner"></div>
  <h2 style="color: var(--primary)">جاري تجهيز النظام...</h2>
</div>

<div id="toast-box"></div>

<!-- Login Screen -->
<main id="loginView" class="login-wrap hidden">
  <div class="login-box animate-in">
    <div style="background:var(--bg-body); width:70px; height:70px; border-radius:20px; display:inline-flex; align-items:center; justify-content:center; margin-bottom:1.5rem; color:var(--primary); transform:rotate(-5deg);">
      <i data-lucide="zap" style="width:36px; height:36px;"></i>
    </div>
    <h1 style="color:var(--primary); margin-bottom:0.5rem; font-size:2rem;">طلباتك برو</h1>
    <p class="muted" style="margin-bottom:2rem;">لوحة التحكم الذكية لإدارة تجارتك</p>

    <div id="roleChoice" style="display:flex; flex-direction:column; gap:1rem;">
      <button class="btn btn-primary" onclick="chooseRole('manager')"><i data-lucide="shield-check"></i> دخول كمدير للنظام</button>
      <button class="btn btn-secondary" onclick="chooseRole('confirmer')"><i data-lucide="headset"></i> دخول فريق التأكيد</button>
    </div>

    <div id="managerLogin" class="hidden animate-in">
      <div class="input-group" style="text-align:right; margin-bottom:1.5rem;">
        <label>كود الإدارة السري</label>
        <input id="managerCode" type="password" inputmode="numeric" placeholder="••••••••" style="text-align:center; font-size:1.5rem; letter-spacing:8px;">
      </div>
      <div style="display:flex; gap:0.5rem;">
        <button class="btn btn-primary" onclick="loginManager()" style="flex:1"><i data-lucide="log-in"></i> دخول</button>
        <button class="btn btn-secondary" onclick="backRole()"><i data-lucide="arrow-right"></i></button>
      </div>
    </div>

    <div id="confirmerLogin" class="hidden animate-in">
      <div class="input-group" style="text-align:right; margin-bottom:1rem;">
        <label>اختر حسابك</label>
        <select id="profileSelect"></select>
      </div>
      <div class="input-group" style="text-align:right; margin-bottom:1.5rem;">
        <label>كود الدخول</label>
        <input id="profileCode" type="password" placeholder="••••" style="text-align:center; font-size:1.5rem; letter-spacing:8px;">
      </div>
      <div style="display:flex; gap:0.5rem;">
        <button class="btn btn-primary" style="flex:1; background:var(--st-conf);" onclick="loginConfirmer()"><i data-lucide="log-in"></i> دخول للحساب</button>
        <button class="btn btn-secondary" onclick="backRole()"><i data-lucide="arrow-right"></i></button>
      </div>
    </div>
  </div>
</main>

<!-- Main App -->
<main id="appView" class="container hidden">
  <header class="topbar animate-in">
    <div style="display:flex; align-items:center; gap:1rem;">
      <div id="userAvatar" style="width:48px; height:48px; background:var(--primary); color:white; border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:1.5rem;"></div>
      <div>
        <h1 id="userNameTitle" style="font-size:1.2rem; margin:0;"></h1>
        <p id="whoRole" class="muted" style="font-weight:700; display:flex; align-items:center; gap:0.3rem; margin:0;"></p>
      </div>
    </div>
    <div style="display:flex; gap:0.5rem;">
      <button class="btn btn-secondary btn-icon" onclick="toggleTheme()"><i data-lucide="moon" id="themeIcon"></i></button>
      <button class="btn btn-secondary btn-icon" style="color:var(--st-rej);" onclick="logout()"><i data-lucide="log-out"></i></button>
    </div>
  </header>

  <nav id="tabs" class="tabs animate-in"></nav>
  
  <section id="content" class="animate-in"></section>
</main>

<script type="module">
// --- إعدادات Firebase ---
const firebaseConfig = {
  apiKey: "AIzaSyDNL9HKom4WCNK8zMC-tOBYzH5uM1L4kDU", 
  authDomain: "orders-team-25634.firebaseapp.com",
  projectId: "orders-team-25634", 
  storageBucket: "orders-team-25634.firebasestorage.app",
  messagingSenderId: "285601621203", 
  appId: "1:285601621203:web:c22025ca3569a1beaf2026"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, addDoc, updateDoc, onSnapshot, serverTimestamp, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const MANAGER_CODE = "7424623008", PAY_PER_DELIVERY = 10;
let db, data = { profiles: [], products: [], orders: [], messages: [] }, user = null, tab = "dashboard", unsub = [];
let initialLoad = false;

// Helpers
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => `${Number(n || 0).toFixed(2)} د.م`;
const fmt = t => t?.toDate ? t.toDate().toLocaleString('ar-MA', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : 'الآن';
const formatPhone = p => { let num = String(p).replace(/\D/g, ''); return num.startsWith('0') ? '212' + num.slice(1) : num; };

// حالات الطلبيات الموسعة
const stateMap = {
  new: { name: 'جديدة', icon: 'inbox' },
  assigned: { name: 'بانتظار التأكيد', icon: 'clock' },
  confirmed: { name: 'مؤكدة', icon: 'check-circle' },
  postponed: { name: 'مؤجلة', icon: 'calendar-clock' },
  no_answer: { name: 'لا يرد', icon: 'phone-off' },
  rejected: { name: 'ملغاة', icon: 'x-circle' },
  shipping: { name: 'قيد الشحن', icon: 'truck' },
  delivered: { name: 'تم التوصيل', icon: 'package-check' },
  returned: { name: 'مرتجع', icon: 'rotate-ccw' }
};

// Toast
function showToast(msg, isError = false) {
  const box = $('toast-box'), t = document.createElement('div');
  t.className = 'toast'; t.style.borderColor = isError ? 'var(--st-rej)' : 'var(--primary)';
  t.innerHTML = `<i data-lucide="${isError ? 'alert-circle' : 'check-circle-2'}" style="color:${isError ? 'var(--st-rej)' : 'var(--primary)'}"></i> <span>${msg}</span>`;
  box.appendChild(t); lucide.createIcons({root:t});
  setTimeout(() => { t.style.opacity=0; t.style.transform='translateY(20px)'; setTimeout(()=>t.remove(),300); }, 3000);
}

// Theme
function initTheme() {
  const t = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
  if($('themeIcon')) $('themeIcon').setAttribute('data-lucide', t==='dark'?'sun':'moon');
}
window.toggleTheme = () => {
  const n = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', n);
  localStorage.setItem('theme', n);
  $('themeIcon').setAttribute('data-lucide', n==='dark'?'sun':'moon');
  lucide.createIcons();
}

// Init
function start() {
  initTheme(); db = getFirestore(initializeApp(firebaseConfig));
  let loaded = 0;
  ['profiles', 'products', 'orders', 'messages'].forEach(name => {
    unsub.push(onSnapshot(query(collection(db, name), orderBy('createdAt', 'desc'), limit(1000)), snap => {
      data[name] = name==='messages' ? snap.docs.map(d=>({id:d.id,...d.data()})).reverse() : snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>!x.deleted&&!x.archived);
      if(name==='profiles') fillProfiles();
      if(!initialLoad) { loaded++; if(loaded===4) { initialLoad=true; setTimeout(checkSession, 500); } }
      else if(user) render();
    }));
  });
}

function fillProfiles() {
  const s = $('profileSelect'); if(!s) return;
  s.innerHTML = data.profiles.length ? '<option value="">— اختر حسابك —</option>' + data.profiles.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('') : '<option value="">لا يوجد حسابات</option>';
}

function checkSession() {
  $('global-loader').style.opacity = '0'; setTimeout(() => $('global-loader').classList.add('hidden'), 400);
  const s = localStorage.getItem('orderSession');
  if(s) {
    try {
      const parsed = JSON.parse(s);
      if(parsed.role === 'manager') { user = parsed; return openApp(); }
      const p = data.profiles.find(x => x.id === parsed.id);
      if(p) { user = { role: 'confirmer', ...p }; return openApp(); }
    } catch(e) {}
    localStorage.removeItem('orderSession');
  }
  $('loginView').classList.remove('hidden'); lucide.createIcons();
}

function saveSession() { if(user) localStorage.setItem('orderSession', JSON.stringify({id:user.id||'manager', role:user.role, name:user.name})); }

window.chooseRole = r => { $('roleChoice').classList.add('hidden'); $(r==='manager'?'managerLogin':'confirmerLogin').classList.remove('hidden'); };
window.backRole = () => { $('managerLogin').classList.add('hidden'); $('confirmerLogin').classList.add('hidden'); $('roleChoice').classList.remove('hidden'); };

window.loginManager = () => { if($('managerCode').value !== MANAGER_CODE) return showToast('كود غير صحيح!', true); user={role:'manager', name:'المدير'}; saveSession(); openApp(); };
window.loginConfirmer = () => { let p = data.profiles.find(x=>x.id===$('profileSelect').value); if(!p || $('profileCode').value!==p.code) return showToast('بيانات خاطئة!', true); user={role:'confirmer', ...p}; saveSession(); openApp(); };

function openApp() {
  $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden');
  $('userNameTitle').textContent = user.name; $('userAvatar').textContent = user.name.charAt(0);
  $('whoRole').innerHTML = `<i data-lucide="${user.role==='manager'?'shield':'headset'}" style="width:14px"></i> ${user.role==='manager'?'لوحة الإدارة':'فريق التأكيد'}`;
  render();
}
window.logout = () => { user = null; localStorage.removeItem('orderSession'); window.location.reload(); };

// Core
function allowed(k) { return user.role === 'manager' || (user.permissions||[]).includes(k); }
function myOrders() { return user.role === 'manager' ? data.orders : data.orders.filter(o => o.confirmerId === user.id); }
window.setTab = t => { tab = t; render(); };

function render() {
  if(!user) return;
  let tArr = [['dashboard','لوحة التحكم','layout-dashboard'], ['orders','إدارة الطلبيات','layers']];
  if(allowed('newOrder')) tArr.push(['neworder','طلبية جديدة','plus-circle']);
  if(allowed('products')) tArr.push(['products','المنتجات','package']);
  tArr.push(['chat','مجتمع الفريق','message-square']);
  if(user.role==='manager') tArr.push(['team','الفريق','users']);

  $('tabs').innerHTML = tArr.map(([id,n,i]) => `<button class="tab-btn ${tab===id?'active':''}" onclick="setTab('${id}')"><i data-lucide="${i}"></i> ${n}</button>`).join('');
  
  const views = { dashboard: viewDashboard, orders: viewOrders, neworder: viewNewOrder, products: viewProducts, team: viewTeam, chat: viewChat };
  $('content').innerHTML = `<div class="animate-in">${(views[tab]||viewDashboard)()}</div>`;
  bindForms(); lucide.createIcons();
  if(tab==='chat') { let c = $('chatScroll'); if(c) c.scrollTop = c.scrollHeight; }
}

// --- Views ---
function viewDashboard() {
  let list = myOrders(), deliv = list.filter(o=>o.status==='delivered'), rev = deliv.reduce((s,o)=>s+Number(o.total||0),0);
  let waitConf = list.filter(o=>o.status==='assigned').length;
  
  return `
    <div class="stats-grid">
      <div class="stat-card"><div class="muted"><i data-lucide="layers" style="width:14px"></i> كل الطلبيات</div><div class="stat-val">${list.length}</div></div>
      <div class="stat-card"><div class="muted"><i data-lucide="package-check" style="width:14px"></i> تم توصيلها</div><div class="stat-val" style="color:var(--st-conf)">${deliv.length}</div></div>
      ${user.role==='manager' 
        ? `<div class="stat-card"><div class="muted"><i data-lucide="wallet" style="width:14px"></i> المداخيل</div><div class="stat-val">${money(rev)}</div></div>`
        : `<div class="stat-card"><div class="muted"><i data-lucide="coins" style="width:14px"></i> مستحقاتي</div><div class="stat-val" style="color:var(--primary)">${money(Math.max(0, deliv.length*PAY_PER_DELIVERY - Number(user.paidTotal||0)))}</div></div>`
      }
    </div>
    ${waitConf && user.role==='confirmer' ? `<div class="card" style="background:var(--st-assign-bg); border-color:var(--st-assign); color:var(--st-assign);"><h3 style="display:flex;align-items:center;gap:0.5rem;"><i data-lucide="alert-triangle"></i> لديك ${waitConf} طلبيات بانتظار التأكيد!</h3></div>` : ''}
    <div class="card">
      <h2 style="display:flex;align-items:center;gap:0.5rem;"><i data-lucide="clock"></i> آخر النشاطات</h2>
      ${list.length ? `<div class="data-list">${list.slice(0,4).map(o=>`
        <div style="display:flex; justify-content:space-between; align-items:center; padding:1rem; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--bg-body);">
          <div><strong>${esc(o.customerName)}</strong> <span class="muted" style="margin:0 0.5rem;">•</span> <span class="muted">${esc(o.city)}</span></div>
          <span class="badge ${o.status}">${stateMap[o.status].name}</span>
        </div>`).join('')}</div>` : '<p class="muted text-center">لا توجد بيانات.</p>'}
    </div>`;
}

window.curFilter = { text: '', status: '' };
function viewOrders() {
  let list = myOrders();
  if(window.curFilter.status) list = list.filter(o => o.status === window.curFilter.status);
  if(window.curFilter.text) {
    let term = window.curFilter.text.toLowerCase();
    list = list.filter(o => (o.customerName||'').toLowerCase().includes(term) || (o.city||'').toLowerCase().includes(term) || (o.phone||'').includes(term));
  }

  return `
    <div class="card" style="display:flex; gap:1rem; flex-wrap:wrap; align-items:center;">
      <div class="input-group" style="flex:2; min-width:200px;"><input type="text" id="srchTxt" placeholder="ابحث بالاسم، الهاتف، المدينة..." value="${esc(window.curFilter.text)}" oninput="updFilt()"></div>
      <div class="input-group" style="flex:1; min-width:150px;">
        <select id="srchSt" onchange="updFilt()">
          <option value="">جميع الحالات</option>
          ${Object.entries(stateMap).map(([k,v]) => `<option value="${k}" ${window.curFilter.status===k?'selected':''}>${v.name}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="data-list">
      ${list.length ? list.map(orderCard).join('') : `<div class="card text-center"><i data-lucide="search-x" style="width:48px;height:48px;color:var(--text-muted);margin-bottom:1rem;opacity:0.5"></i><p class="muted">لا توجد طلبيات مطابقة.</p></div>`}
    </div>`;
}
window.updFilt = () => { window.curFilter = { text: $('srchTxt').value, status: $('srchSt').value }; render(); };

// --- بطاقة الطلبية الاحترافية المتجاوبة ---
function orderCard(o) {
  let p = data.profiles.find(x => x.id === o.confirmerId);
  let canConfirm = user.role === 'confirmer' && o.status === 'assigned';
  let waLink = `<a href="https://wa.me/${formatPhone(o.phone)}" target="_blank" style="color:var(--wa-color); background:rgba(37, 211, 102, 0.1); padding:0.4rem; border-radius:var(--radius-sm); display:inline-flex;" title="مراسلة واتساب"><i data-lucide="message-circle" style="width:16px;height:16px;"></i></a>`;
  
  // Controls Manager
  let mgrAssign = user.role === 'manager' ? `<select onchange="assignOrder('${o.id}',this.value)" style="padding:0.5rem; font-size:0.85rem;"><option value="">${o.status==='new'?'إسناد لمؤكد':'المؤكد: '+(p?.name||'غير مسندة')}</option>${data.profiles.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>` : '';
  let mgrStatus = user.role === 'manager' ? `<select onchange="changeStatus('${o.id}',this.value)" style="padding:0.5rem; font-size:0.85rem;"><option value="">تغيير حالة الشحن</option><option value="shipping">📦 قيد الشحن</option><option value="delivered">✅ تم التوصيل</option><option value="returned">🔙 مرتجع</option></select>` : '';
  
  // Controls Confirmer
  let confBtns = canConfirm ? `
    <textarea id="n-${o.id}" placeholder="ملاحظة إضافية (اختياري)..." style="font-size:0.85rem; padding:0.5rem; min-height:40px; margin-bottom:0.5rem;"></textarea>
    <div class="action-row">
      <button class="action-btn" style="background:var(--st-conf-bg); color:var(--st-conf);" onclick="doConfirm('${o.id}','confirmed')"><i data-lucide="check" style="width:14px;"></i> تأكيد</button>
      <button class="action-btn" style="background:var(--st-postpone-bg); color:var(--st-postpone);" onclick="doConfirm('${o.id}','postponed')"><i data-lucide="clock" style="width:14px;"></i> تأجيل</button>
      <button class="action-btn" style="background:var(--st-noans-bg); color:var(--st-noans);" onclick="doConfirm('${o.id}','no_answer')"><i data-lucide="phone-off" style="width:14px;"></i> لا يرد</button>
      <button class="action-btn" style="background:var(--st-rej-bg); color:var(--st-rej);" onclick="doConfirm('${o.id}','rejected')"><i data-lucide="x" style="width:14px;"></i> إلغاء</button>
    </div>` : '';

  return `
    <div class="data-card">
      <div class="dc-header">
        <div>
          <div class="dc-title">${esc(o.customerName)}</div>
          <div class="dc-date">${fmt(o.createdAt)}</div>
        </div>
        <span class="badge ${o.status}"><i data-lucide="${stateMap[o.status].icon}" style="width:14px;"></i> ${stateMap[o.status].name}</span>
      </div>
      
      <div class="dc-grid">
        <div class="dc-item">
          <div class="dc-icon"><i data-lucide="phone" style="width:16px;"></i></div>
          <div style="flex:1; display:flex; justify-content:space-between; align-items:center;">
             <span dir="ltr" style="font-weight:700;">${esc(o.phone)}</span>
             ${waLink}
          </div>
        </div>
        <div class="dc-item">
          <div class="dc-icon"><i data-lucide="map-pin" style="width:16px;"></i></div>
          <div>${esc(o.city)}</div>
        </div>
        <div class="dc-item">
          <div class="dc-icon"><i data-lucide="package" style="width:16px;"></i></div>
          <div>
            <div>${esc(o.productName)} <span class="muted">×${o.qty}</span></div>
            <div class="price-tag">${money(o.total)}</div>
          </div>
        </div>
      </div>
      
      <div class="dc-actions">
        ${o.confirmationNote ? `<div style="background:var(--bg-body); padding:0.5rem; border-radius:var(--radius-sm); font-size:0.85rem; margin-bottom:0.5rem; border:1px solid var(--border);"><i data-lucide="message-square" style="width:12px; color:var(--text-muted)"></i> ${esc(o.confirmationNote)}</div>` : ''}
        ${user.role==='manager' ? `<div style="display:flex; flex-direction:column; gap:0.5rem;">${mgrAssign} ${mgrStatus}</div>` : confBtns}
      </div>
    </div>`;
}

function viewNewOrder() {
  if(!data.products.length) return `<div class="card text-center"><h2 style="color:var(--st-rej)">أضف منتجاً أولاً</h2><p class="muted">يجب توفر منتج واحد على الأقل لإضافة طلبية.</p></div>`;
  return `
    <div class="card" style="max-width:800px; margin:auto;">
      <h2><i data-lucide="plus-circle"></i> طلبية جديدة</h2>
      <form id="orderForm" class="form-grid" style="margin-top:1.5rem;">
        <div class="input-group"><label>اسم العميل</label><input name="customerName" required></div>
        <div class="input-group"><label>رقم الهاتف</label><input name="phone" required dir="ltr" style="text-align:right" placeholder="06XXXXXXXX"></div>
        <div class="input-group"><label>المدينة / العنوان</label><input name="city" required></div>
        <div class="input-group"><label>المنتج</label><select name="productId" required><option value="">— اختر المنتج —</option>${data.products.map(p=>`<option value="${p.id}">${esc(p.name)} - ${money(p.price)}</option>`).join('')}</select></div>
        <div class="input-group"><label>الكمية</label><input name="qty" type="number" min="1" value="1" required></div>
        <div style="grid-column: 1 / -1; margin-top:1rem; text-align:left;"><button type="submit" class="btn btn-primary"><i data-lucide="save"></i> حفظ وإضافة</button></div>
      </form>
    </div>`;
}

function viewProducts() {
  return `
    ${allowed('products') ? `
    <div class="card" style="border: 2px dashed var(--primary); background:var(--bg-body);">
      <h2 style="color:var(--primary)"><i data-lucide="package-plus"></i> إضافة منتج</h2>
      <form id="productForm" class="form-grid" style="align-items:end;">
        <div class="input-group" style="flex:2"><label>اسم المنتج</label><input name="name" required></div>
        <div class="input-group" style="flex:1"><label>السعر (د.م)</label><input name="price" type="number" step="0.01" required></div>
        <button type="submit" class="btn btn-primary" style="padding:0.9rem"><i data-lucide="plus"></i> إضافة</button>
      </form>
    </div>` : ''}
    <div class="card">
      <h2>المنتجات المتاحة</h2>
      ${data.products.length ? `<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:1rem;">
        ${data.products.map(p=>`
          <div style="border:1px solid var(--border); padding:1rem; border-radius:var(--radius-md); display:flex; justify-content:space-between; align-items:center;">
            <div><div style="font-weight:800; font-size:1.1rem">${esc(p.name)}</div><div class="price-tag">${money(p.price)}</div></div>
            ${user.role==='manager' ? `<button class="btn btn-icon btn-secondary" style="color:var(--st-rej)" onclick="delProd('${p.id}')"><i data-lucide="trash-2"></i></button>` : ''}
          </div>`).join('')}
      </div>` : '<p class="muted">لا توجد منتجات.</p>'}
    </div>`;
}

function viewTeam() {
  return `
    <div class="card">
      <h2><i data-lucide="user-plus"></i> إنشاء حساب مؤكد</h2>
      <form id="profileForm" class="form-grid">
        <div class="input-group"><label>الاسم الكامل</label><input name="name" required></div>
        <div class="input-group"><label>كود الدخول السري</label><input name="code" required></div>
        <div class="input-group" style="grid-column:1/-1;">
          <label>صلاحيات إضافية</label>
          <div style="display:flex; gap:1.5rem; margin-top:0.5rem; background:var(--bg-body); padding:1rem; border-radius:var(--radius-md);">
            <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer; font-weight:700;"><input type="checkbox" name="permissions" value="newOrder"> إضافة الطلبيات</label>
            <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer; font-weight:700;"><input type="checkbox" name="permissions" value="products"> إدارة المنتجات</label>
          </div>
        </div>
        <div style="grid-column:1/-1; text-align:left;"><button type="submit" class="btn btn-primary"><i data-lucide="check-circle"></i> إنشاء الحساب</button></div>
      </form>
    </div>
    
    <h2 style="margin-top:2rem;">إحصائيات الفريق والمستحقات</h2>
    <div class="form-grid">
      ${data.profiles.map(p => {
        let d = data.orders.filter(o => o.confirmerId === p.id && o.status === 'delivered');
        let due = Math.max(0, (d.length * PAY_PER_DELIVERY) - Number(p.paidTotal || 0));
        return `
          <div class="card" style="margin-bottom:0; display:flex; flex-direction:column; justify-content:space-between;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1rem;">
              <div>
                <h3 style="margin-bottom:0.2rem">${esc(p.name)}</h3>
                <span class="muted" style="font-size:0.8rem">صلاحيات: ${(p.permissions||[]).join(', ')||'التأكيد فقط'}</span>
              </div>
              <button class="btn btn-icon btn-secondary" style="color:var(--st-rej)" onclick="delProf('${p.id}')"><i data-lucide="user-x"></i></button>
            </div>
            
            <div style="background:var(--bg-body); padding:1rem; border-radius:var(--radius-md); display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; margin-bottom:1rem; text-align:center;">
              <div><span class="muted" style="display:block; font-size:0.8rem;">توصيل</span><strong style="font-size:1.1rem">${d.length}</strong></div>
              <div><span class="muted" style="display:block; font-size:0.8rem;">مدفوع</span><strong style="font-size:1.1rem">${money(p.paidTotal||0)}</strong></div>
              <div style="grid-column:1/-1; margin-top:0.5rem; padding-top:0.5rem; border-top:1px dashed var(--border); color:var(--st-assign);"><span class="muted" style="display:block; font-size:0.8rem;">مستحق الدفع</span><strong style="font-size:1.2rem">${money(due)}</strong></div>
            </div>
            <button class="btn btn-secondary" style="width:100%; border-color:var(--primary); color:var(--primary);" onclick="payProf('${p.id}')"><i data-lucide="banknote"></i> تسجيل دفعة مالية</button>
          </div>`;
      }).join('') || '<p class="muted">لا يوجد أعضاء في الفريق.</p>'}
    </div>`;
}

function viewChat() {
  return `
    <div class="card" style="height: calc(100vh - 160px); display: flex; flex-direction: column; padding: 1rem; max-width:800px; margin:auto;">
      <h2 style="border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 1rem;"><i data-lucide="messages-square"></i> محادثات الفريق</h2>
      <div id="chatScroll" style="flex: 1; overflow-y: auto; display:flex; flex-direction:column; gap:1rem; padding-right:0.5rem;">
        ${data.messages.length ? data.messages.map(m => {
          let isMe = m.senderId === user.id || (m.senderId === 'manager' && user.role === 'manager');
          return `
          <div style="align-self: ${isMe?'flex-end':'flex-start'}; max-width: 85%; background: ${isMe?'var(--primary-hover)':'var(--bg-body)'}; color: ${isMe?'white':'var(--text-main)'}; padding: 0.8rem 1.2rem; border-radius: var(--radius-lg); ${isMe?'border-bottom-left-radius: 4px;':'border-bottom-right-radius: 4px;'}">
            <div style="font-size: 0.75rem; font-weight:700; opacity:0.8; margin-bottom:0.3rem; display:flex; justify-content:space-between; gap:1rem;">
              <span>${esc(m.senderName)} ${m.senderRole === 'manager' ? '<i data-lucide="shield-check" style="width:12px;"></i>' : ''}</span>
              <span style="font-weight:normal">${fmt(m.createdAt)}</span>
            </div>
            <div style="line-height: 1.5; font-size:0.95rem;">${esc(m.text)}</div>
          </div>`;
        }).join('') : '<div class="muted text-center" style="margin-top:2rem">ابدأ التواصل مع فريقك الآن...</div>'}
      </div>
      <form id="chatForm" style="display: flex; gap: 0.5rem; margin-top: 1rem; border-top: 1px solid var(--border); padding-top:1rem;">
        <input type="text" name="msgText" placeholder="اكتب رسالة..." required style="flex: 1; border-radius: 99px; padding: 0.8rem 1.5rem;">
        <button type="submit" class="btn btn-primary" style="border-radius: 99px; padding: 0 1.5rem;"><i data-lucide="send"></i></button>
      </form>
    </div>`;
}

// --- العمليات ---
function bindForms() {
  let fOrd = $('orderForm');
  if(fOrd) fOrd.onsubmit = async e => {
    e.preventDefault(); let btn = e.submitter; btn.disabled=true;
    try {
      let x = Object.fromEntries(new FormData(fOrd)), p = data.products.find(i=>i.id===x.productId), q = Number(x.qty);
      await addDoc(collection(db, 'orders'), { customerName: x.customerName.trim(), phone: x.phone.trim(), city: x.city.trim(), productId: p.id, productName: p.name, unitPrice: Number(p.price), qty: q, total: Number(p.price)*q, status: 'new', createdAt: serverTimestamp() });
      fOrd.reset(); showToast('تم إضافة الطلبية'); setTab('orders');
    } catch(err) { showToast('خطأ: ' + err.message, true); btn.disabled=false; }
  };

  let fPrd = $('productForm');
  if(fPrd) fPrd.onsubmit = async e => {
    e.preventDefault(); let btn = e.submitter; btn.disabled=true;
    try {
      let x = Object.fromEntries(new FormData(fPrd));
      await addDoc(collection(db, 'products'), { name: x.name.trim(), price: Number(x.price), createdAt: serverTimestamp() });
      fPrd.reset(); showToast('تم حفظ المنتج'); btn.disabled=false;
    } catch(err) { showToast('خطأ', true); btn.disabled=false; }
  };

  let fPrf = $('profileForm');
  if(fPrf) fPrf.onsubmit = async e => {
    e.preventDefault(); let btn = e.submitter; btn.disabled=true;
    try {
      let fd = new FormData(fPrf);
      await addDoc(collection(db, 'profiles'), { name: fd.get('name').trim(), code: fd.get('code'), permissions: fd.getAll('permissions'), paidTotal: 0, createdAt: serverTimestamp() });
      fPrf.reset(); showToast('تم إنشاء الحساب'); btn.disabled=false;
    } catch(err) { showToast('خطأ', true); btn.disabled=false; }
  };

  let fChat = $('chatForm');
  if(fChat) fChat.onsubmit = async e => {
    e.preventDefault(); let txt = fChat.msgText.value.trim(); if(!txt) return; fChat.msgText.value = '';
    try { await addDoc(collection(db, 'messages'), { text: txt, senderId: user.role==='manager'?'manager':user.id, senderName: user.name, senderRole: user.role, createdAt: serverTimestamp() }); } catch(e){}
  };
}

window.assignOrder = async (id, pid) => { if(pid) { await updateDoc(doc(db,'orders',id),{confirmerId:pid, status:'assigned', assignedAt:serverTimestamp()}); showToast('تم إسناد الطلبية'); }};
window.changeStatus = async (id, st) => { if(st) { await updateDoc(doc(db,'orders',id),{status:st}); showToast('تم تحديث حالة الشحن'); }};
window.doConfirm = async (id, st) => { let note = $(`n-${id}`)?.value.trim()||''; await updateDoc(doc(db,'orders',id),{status:st, confirmationNote:note, confirmedAt:serverTimestamp()}); showToast('تم حفظ ردك'); };
window.delProd = async id => { if(confirm('متأكد من حذف المنتج؟')) await updateDoc(doc(db,'products',id),{deleted:true}); };
window.delProf = async id => { if(confirm('حذف الحساب بصفة نهائية؟')) await updateDoc(doc(db,'profiles',id),{archived:true}); };
window.payProf = async id => { 
  let p = data.profiles.find(x=>x.id===id), amt = prompt(`تسجيل دفعة لـ ${p.name}\nأدخل المبلغ الجديد الذي سدده الآن:`); 
  if(amt && Number(amt)>0) { await updateDoc(doc(db,'profiles',id),{paidTotal: Number(p.paidTotal||0) + Number(amt)}); showToast('تم تسجيل الدفعة بنجاح'); }
};

start();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
